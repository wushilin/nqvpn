coordinator = "https://coord.example.com:8443"
# trust_any_cert = true             # default; false + ca = strict verification
# ca = "/etc/nqvpn/coord-ca.pem"

network_id  = "acme-prod"
name        = "laptop-1"
secret      = "change-me-laptop"    # or secret_file = "/etc/nqvpn/laptop-1.secret"
state_dir   = "/var/lib/nqvpn-client"
