[listen]
api  = "0.0.0.0:8443"       # HTTPS: /api/v1/* and /ui — self-signed certificate
                            # generated into state.dir unless [tls] is set
quic = "0.0.0.0:14433"      # QUIC control plane; the port is published to
                            # members at join, so they only configure the API URL

[state]
dir = "/var/lib/nqvpn-coord" # registries, secrets.toml (0600), signing key, cert

[admin]
bearer_token = "change-me"  # or bearer_token_file = "/etc/nqvpn/admin-token"

# Optional: a real certificate for both the API and the control port.
# [tls]
# cert = "/etc/nqvpn/tls/fullchain.pem"
# key  = "/etc/nqvpn/tls/privkey.pem"

# [limits]
# join_rate_per_min = 30    # per (member name, source IP)
