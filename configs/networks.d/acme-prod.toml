network_id = "acme-prod"
cidrs = ["10.99.0.0/16", "fd99::/64"]

[pools.default]
cidr = "10.99.1.0/24"
[pools.v6]
cidr = "fd99::1:0/112"

# A member is a name + a secret. Secrets minted from the admin API/UI
# live in the state dir and take precedence over the ones written here.
# The wire identity (a 32-bit node id) is assigned by the coordinator at
# first join and is never configured.
[relays.home]
secret = "change-me-home"
relay_addr = "203.0.113.7:4444"
allowed_cidrs = ["192.168.1.0/24"]
preferred_ip4 = "10.99.0.1"

[relays.home-backup]
secret = "change-me-backup"
relay_addr = "203.0.113.8:4444"
allowed_cidrs = ["192.168.1.0/24"]

[clients.laptop-1]
secret = "change-me-laptop"
