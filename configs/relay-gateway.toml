# A site gateway: this relay takes a VPN address and fronts its LAN, so
# members reach 192.168.1.0/24 through it. Needs root for the TUN, and
# the LAN's hosts must route VPN prefixes back via this machine (make it
# the LAN default gateway, or add a static route on the LAN router).
# Two gateways may front the same LAN; the older registration carries
# traffic and the younger takes over when it dies.

coordinator = "https://coord.example.com:8443"
listen     = "0.0.0.0:4444"
relay_addr = "home.example.com:4444"
state_dir  = "/var/lib/nqvpn-relay"
# tun_name = "nqvpn0"               # Linux: any name; macOS: utunN

[[networks]]
network_id  = "acme-prod"
name        = "home"
secret_file = "/etc/nqvpn/home.secret"
local_cidrs = ["192.168.1.0/24"]    # must be within allowed_cidrs at the coordinator
# preferred_ip4 = "10.99.0.1"       # or set it in the coordinator's entry
