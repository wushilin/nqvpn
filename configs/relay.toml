# NetQ VPN relay. Everything about this relay's place in a network —
# its advertised address, overlay address, the LANs it routes — is
# configured at the coordinator and handed down at join. This file holds
# only local facts and the token.

listen    = "0.0.0.0:4444"        # the port in this relay's address at the coordinator
state_dir = "/var/lib/nqvpn-relay"
# tun_name = "nqvpn0"             # only used when the relay has an endpoint role
# The coordinator is verified by default (the token carries its
# fingerprint, or the system roots verify a CA-signed cert).
# trust_any_cert = true           # set only to deliberately skip verification
# ca = "/etc/nqvpn/coord-ca.pem"

[limits]
# max_session_mbps = 0            # per attached client; 0 = what the coordinator says
# workers = 0                     # tokio threads; 0 = one per core

# One entry per network this relay serves; paste the token from the UI.
[[networks]]
token_file = "/etc/nqvpn/relay.token"
# token = "nqv1.…"
