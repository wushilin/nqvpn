<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nqvpn control plane</title>
<style>
:root{--bg:#fbfbfd;--fg:#1d1d22;--muted:#6b6b78;--line:#e3e3ea;--card:#fff;--sunk:#f5f5f8;
      --ok:#0a7a44;--okbg:#e6f5ed;--off:#8a8a96;--offbg:#f0f0f3;--warn:#a4571a;--warnbg:#fdf1e3;
      --bad:#b3261e;--badbg:#fbe9e7;
      --accent:#2b5fd9;--accent2:#7d3fd1;--heat:43,95,217;--shadow:0 1px 3px rgba(0,0,0,.07),0 8px 24px rgba(0,0,0,.06);}
@media (prefers-color-scheme:dark){
:root{--bg:#131317;--fg:#ececf1;--muted:#9a9aa6;--line:#2a2a33;--card:#1b1b21;--sunk:#16161b;
      --ok:#54d19a;--okbg:#14301f;--off:#8a8a96;--offbg:#232329;--warn:#e0a35c;--warnbg:#33240f;
      --bad:#ff7b72;--badbg:#3a1a17;
      --accent:#7ea2ff;--accent2:#b48cff;--heat:126,162,255;--shadow:0 1px 3px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
     font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
       padding:14px 24px;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
main{padding:20px 24px 60px;max-width:1320px;margin:0 auto}
.cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-width:118px}
.card .n{font-size:24px;font-weight:640;letter-spacing:-.02em}
.card .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
   margin:26px 0 10px;font-weight:600;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
h2:first-child{margin-top:4px}
h2 .gen{font-weight:700;color:var(--accent);text-transform:none;letter-spacing:0}
h2 .uuid{font-weight:400;text-transform:none;letter-spacing:0;font-family:ui-monospace,Menlo,monospace;font-size:11px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;
   letter-spacing:.04em;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
tr:last-child td{border-bottom:none}
code{font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600}
.on{background:var(--okbg);color:var(--ok)}
.offl{background:var(--offbg);color:var(--off)}
.dis{background:var(--warnbg);color:var(--warn)}
.warnpill{background:var(--warnbg);color:var(--warn)}
.badpill{background:var(--badbg);color:var(--bad)}
button{font:inherit;font-size:13px;padding:5px 11px;border:1px solid var(--line);
       border-radius:7px;background:var(--card);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
button.danger{border-color:var(--warn);color:var(--warn)}
button.primary{border-color:var(--accent);color:var(--accent);font-weight:600}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.msg{font-size:13px;color:var(--muted)}
.err{color:var(--warn)}
input{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);
      border-radius:7px;background:var(--card);color:var(--fg);min-width:240px}
input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.note{color:var(--muted);font-size:13px;margin:-4px 0 12px;max-width:74ch}
.subline{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.subline.warn{color:var(--warn)}
.name{cursor:pointer;font-weight:560}
.name:hover{color:var(--accent)}
.actions button{margin-right:6px}

/* ---- tabs ---- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{border:none;background:none;border-radius:0;padding:9px 15px;color:var(--muted);
             font-weight:560;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.pane[hidden]{display:none}

/* ---- traffic matrix ---- */
.matrix{border-collapse:separate;border-spacing:0;font-size:13px;width:auto;min-width:100%}
.matrix th,.matrix td{border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.matrix th:last-child,.matrix td:last-child{border-right:none}
.matrix thead th{position:sticky;top:0;background:var(--card);z-index:2;text-align:center;padding:9px 12px}
.matrix tbody th{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;
                 text-transform:none;font-size:13px;letter-spacing:0;color:var(--fg);font-weight:600}
.matrix td{padding:8px 12px;text-align:right;font-variant-numeric:tabular-nums;position:relative}
.matrix .corner{background:var(--card);z-index:3;left:0}
.cell{display:flex;flex-direction:column;gap:1px;align-items:flex-end;position:relative;z-index:1}
.cell .up{color:var(--fg);font-weight:560}
.cell .dn{color:var(--muted);font-size:12px}
.cell .rate{color:var(--accent);font-size:11px;font-weight:600}
.zero{color:var(--muted);opacity:.45}
.diag{background:var(--sunk)}
.heat{position:absolute;inset:0;background:rgb(var(--heat));z-index:0;pointer-events:none}
.down{outline:1px dashed var(--warn);outline-offset:-2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}

/* ---- topology ---- */
.map{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.node{cursor:pointer}
.node:hover .ring{stroke-width:3}
.nlabel{font:600 13px ui-sans-serif,system-ui,sans-serif;fill:var(--fg);text-anchor:middle}
.nsub{font:11px ui-monospace,Menlo,monospace;fill:var(--muted);text-anchor:middle}
.clabel{font:10px ui-sans-serif,system-ui,sans-serif;fill:var(--muted);text-anchor:middle}
.link{stroke:var(--accent);stroke-linecap:round}
.link.dead{stroke:var(--off);stroke-dasharray:5 5;opacity:.4}

/* ---- modal ---- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;
         justify-content:center;padding:24px;z-index:50;backdrop-filter:blur(2px)}
.overlay[hidden]{display:none}
.modal{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
       max-width:640px;width:100%;max-height:82vh;overflow:auto}
.modal header{border-radius:14px 14px 0 0;position:sticky;top:0}
.modal .body{padding:18px 22px 22px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13px;margin-bottom:18px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
.clist{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.clist li{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line);font-size:13px}
.clist li:last-child{border-bottom:none}
.clist .nm{font-weight:560}
.clist .ips{margin-left:auto;font-family:ui-monospace,Menlo,monospace;color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-size:13px;padding:14px;text-align:center;
       border:1px dashed var(--line);border-radius:9px}

/* ---- the secret ---- */
.secret-box{border:1px solid var(--accent);border-radius:10px;background:var(--sunk);
            padding:16px;font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
            word-break:break-all;user-select:all}
.warnbar{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:9px;
         background:var(--warnbg);color:var(--warn);font-size:13px;line-height:1.5;
         margin-bottom:14px}
.warnbar b{font-weight:680}
.cfg{padding:14px;font:12.5px/1.6 ui-monospace,Menlo,monospace;white-space:pre;overflow-x:auto;user-select:all}
</style>
</head>
<body>
<header>
  <h1>nqvpn</h1>
  <span class="sub">control plane</span>
  <span style="flex:1"></span>
  <span class="sub" id="clock"></span>
</header>
<main>
  <div class="bar">
    <input id="token" type="password" placeholder="admin bearer token" autocomplete="off">
    <button id="save">Connect</button>
    <button id="reload">Reload config</button>
    <span class="msg" id="msg"></span>
  </div>

  <div class="cards" id="cards"></div>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="status" aria-selected="true">Status</button>
    <button role="tab" data-tab="topology" aria-selected="false">Topology</button>
    <button role="tab" data-tab="stats" aria-selected="false">Stats</button>
  </div>

  <div class="pane" id="pane-status"></div>
  <div class="pane" id="pane-topology" hidden></div>
  <div class="pane" id="pane-stats" hidden></div>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="modal" id="confirmModal" role="dialog" aria-modal="true">
    <header>
      <h1 id="modal-title">node</h1>
      <span class="sub" id="modal-sub"></span>
      <span style="flex:1"></span>
      <button id="modal-close">Close</button>
    </header>
    <div class="body" id="modal-body"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c;
  if (txt !== undefined) e.textContent = txt; return e; };
const svgEl = (t, attrs = {}) => { const e = document.createElementNS('http://www.w3.org/2000/svg', t);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
const enc = encodeURIComponent;

/// The admin token lives in this variable and nowhere else: it is never
/// written to storage, so closing the tab forgets it.
let token = '';
let activeTab = 'status';
/** Last payload, so modals can render without another round trip. */
let snapshot = null;

function msg(text, isErr) { const m = $('#msg'); m.textContent = text; m.className = isErr ? 'msg err' : 'msg'; }

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { ...(opts.headers||{}), 'Authorization': 'Bearer ' + token } });
  if (!r.ok) {
    let detail = r.status;
    try { const b = await r.json(); if (b.error) detail = b.error.code + ': ' + b.error.message; } catch {}
    throw new Error(detail);
  }
  return r.json();
}

const memberPath = (net, m) => `/api/v1/networks/${enc(net)}/members/${enc(m.name)}`;

/* ---------- formatting ---------- */

// Binary units, because these count octets on a wire, not disk marketing.
const UNITS = ['B','KiB','MiB','GiB','TiB','PiB'];
function fmtBytes(n) {
  if (!n) return '0';
  let v = n, i = 0;
  while (v >= 1024 && i < UNITS.length - 1) { v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(2)) + ' ' + UNITS[i];
}
// Rates are quoted in bits, the convention every link speed uses.
const RUNITS = ['bps','kbps','Mbps','Gbps','Tbps'];
function fmtRate(bytesPerSec) {
  if (!bytesPerSec) return '';
  let v = bytesPerSec * 8, i = 0;
  while (v >= 1000 && i < RUNITS.length - 1) { v /= 1000; i++; }
  return (i === 0 ? Math.round(v) : v.toFixed(1)) + ' ' + RUNITS[i];
}
function fmtPkts(n) {
  if (n < 1000) return n + '';
  if (n < 1e6) return (n/1e3).toFixed(1) + 'K';
  if (n < 1e9) return (n/1e6).toFixed(1) + 'M';
  return (n/1e9).toFixed(2) + 'G';
}
const nowUnix = () => Math.floor(Date.now() / 1000);
function fmtAge(unix) {
  if (!unix) return '—';
  const s = Math.max(0, nowUnix() - unix);
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
  if (s < 86400) return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
  return Math.floor(s / 86400) + 'd ' + Math.floor((s % 86400) / 3600) + 'h';
}
const fmtTime = unix => unix ? new Date(unix * 1000).toLocaleString() : '—';
const addrOf = m => [m.ip4, m.ip6].filter(Boolean).join('  ');

/* ---------- shared bits ---------- */

function pill(m) {
  if (m.disabled) return el('span', 'pill dis', 'disabled');
  return m.online ? el('span', 'pill on', 'online') : el('span', 'pill offl', 'offline');
}

/// How the member's view of the network compares with the coordinator's.
/// A member reports the generation it applied plus a digest of it; a
/// matching generation with a wrong digest means it holds a different
/// table than the one the coordinator handed out.
function viewState(st, m) {
  if (m.reported_gen === undefined || m.reported_gen === null) {
    return { cls: 'muted', label: 'no report', title: 'This member has not reported which generation it applied yet.' };
  }
  const g = m.reported_gen, cur = st.gen;
  if (g === cur && m.digest_ok) {
    return { cls: 'pill on', label: 'OK · gen ' + g, title: 'Applied the current generation and its digest matches.' };
  }
  if (g < cur) {
    return { cls: 'pill warnpill', label: `behind · ${g} / ${cur}`,
             title: `Applied generation ${g}; the network is at ${cur}. It should catch up on its next heartbeat.` };
  }
  if (g > cur) {
    return { cls: 'pill badpill', label: `mismatch · ${g} > ${cur}`,
             title: `Reports generation ${g}, newer than the coordinator's ${cur}. Usually a coordinator restart; the next push fixes it.` };
  }
  return { cls: 'pill badpill', label: 'mismatch · gen ' + g,
           title: 'Generation matches but the digest does not: the member holds a different table than this coordinator sent.' };
}

function viewCell(st, m) {
  const v = viewState(st, m);
  const s = el('span', v.cls, v.label);
  s.title = v.title;
  return s;
}

function table(headers, rows) {
  const wrap = el('div', 'wrap');
  const t = el('table');
  const thead = el('thead'), htr = el('tr');
  headers.forEach(h => htr.append(el('th', null, h)));
  thead.append(htr); t.append(thead);
  const tb = el('tbody'); rows.forEach(r => tb.append(r)); t.append(tb);
  wrap.append(t);
  return wrap;
}

function netHeading(st, label) {
  const h = el('h2');
  h.append(el('span', null, label ? `${label} · ${st.network_id}` : st.network_id));
  h.append(el('span', 'gen', 'gen ' + st.gen));
  if (!label) h.append(el('span', 'uuid', st.network_uuid));
  return h;
}

/* ---------- members ---------- */

function memberRow(st, m) {
  const net = st.network_id;
  const tr = el('tr');

  const nm = el('td'); const nl = el('span', 'name', m.name);
  nl.onclick = () => (m.role === 'relay' ? showRelay(st, m) : showMember(st, m));
  nm.append(nl); tr.append(nm);

  const idc = el('td'); idc.append(el('code', null, '#' + m.node_id)); tr.append(idc);
  tr.append(el('td', 'muted', m.role));
  const state = el('td'); state.append(pill(m)); tr.append(state);
  const ip = el('td'); ip.append(el('code', null, addrOf(m) || '—')); tr.append(ip);
  const cidrs = el('td'); cidrs.append(el('code', null, (m.registered_cidrs||[]).join(' ') || '—')); tr.append(cidrs);

  // Relays have no attached relay; the useful fact about them is whether
  // the coordinator can dial the address they advertise.
  const relay = el('td');
  if (m.role === 'relay') {
    if (m.advertised_reachable === 'unreachable') {
      relay.append(el('span', 'pill dis', 'unreachable'));
      relay.title = 'The coordinator cannot dial this relay\'s advertised address. ' +
                    'Other relays will fail to mesh with it — check the firewall and relay_addr.';
    } else if (m.advertised_reachable === 'reachable') {
      relay.append(el('span', 'pill on', 'reachable'));
    } else {
      relay.append(el('span', 'muted', 'not probed'));
    }
  } else {
    relay.append(el('span', m.attached_relay ? '' : 'muted', m.attached_relay || '—'));
  }
  tr.append(relay);

  const hb = el('td');
  if (m.last_heartbeat_unix) {
    hb.append(el('span', null, fmtAge(m.last_heartbeat_unix) + ' ago'));
    hb.title = fmtTime(m.last_heartbeat_unix);
  } else hb.append(el('span', 'muted', '—'));
  tr.append(hb);

  const view = el('td'); view.append(viewCell(st, m)); tr.append(view);

  const join = el('td');
  if (m.last_join_unix) {
    join.append(el('span', null, m.last_join_from || 'unknown source'));
    join.append(el('span', 'subline', fmtTime(m.last_join_unix) + ' · login gen ' + m.login_gen));
  } else {
    join.append(el('span', 'muted', 'never'));
  }
  if (m.replaced_unix) {
    const rep = el('span', 'subline warn',
      'replaced from ' + (m.replaced_from || 'unknown') + ' at ' + fmtTime(m.replaced_unix));
    rep.title = 'A newer session for this node id took over and the earlier one was closed. ' +
                'Two machines with the same node id and secret will keep displacing each other.';
    join.append(rep);
  }
  tr.append(join);

  const act = el('td', 'actions');
  const sec = el('button', null, 'Show secret');
  sec.onclick = () => showSecret(net, m);
  const toggle = el('button', null, m.disabled ? 'Enable' : 'Disable');
  toggle.onclick = async () => {
    toggle.disabled = true;
    try {
      const r = await api(memberPath(net, m) + `/${m.disabled ? 'enable' : 'disable'}`, { method: 'POST' });
      msg(`${r.disabled ? 'Disabled' : 'Enabled'} ${m.name}`); refresh();
    } catch (e) { msg('' + e.message, true); toggle.disabled = false; }
  };
  const del = el('button', 'danger', 'Delete');
  del.onclick = () => confirmModal({
    title: 'Delete ' + m.name + '?',
    sub: net + ' · #' + m.node_id,
    lead: 'This forgets the member and everything the coordinator holds for it. It does not ' +
          'ban it: if node id #' + m.node_id + ' is still listed in the network config with a ' +
          'secret, it can join again. Use Disable if the intent is to keep it out.',
    details: [
      'Its VPN address (' + (addrOf(m) || 'none') + ') is released back to the pool',
      'Any managed secret for it is deleted; only a config secret, if one exists, would still admit it',
      'Any routes it owns are withdrawn; the next-oldest registrant takes over',
      m.online ? 'It is currently ONLINE and its session will be closed' : 'It is offline',
    ],
    danger: 'Delete member',
    onConfirm: async () => {
      const r = await api(memberPath(net, m), { method: 'DELETE' });
      const freed = [r.freed_ip4, r.freed_ip6].filter(Boolean).join(', ');
      msg(`Deleted ${m.name}` +
          (freed ? ` — freed ${freed}` : '') +
          (r.secret_removed ? ' — managed secret removed' : '') +
          (r.still_in_config ? ' — still in the network config, so it can re-join' : ''));
      refresh();
    },
  });
  act.append(sec, toggle, del);
  tr.append(act);
  return tr;
}

/* ---------- secret modal ---------- */

async function showSecret(net, m) {
  const body = openModal(m.name, `secret · #${m.node_id} · ${net}`);
  body.append(el('div', 'empty', 'Loading…'));
  let r;
  try { r = await api(memberPath(net, m) + '/secret'); }
  catch (e) { body.replaceChildren(el('div', 'empty', 'Could not load the secret: ' + e.message)); return; }
  paintSecret(body, net, m, r, false);
}

/// `fresh` is true right after a Regenerate, when the operator needs to
/// be told the old value is already dead.
function paintSecret(body, net, m, r, fresh) {
  body.replaceChildren();

  if (fresh) {
    const warn = el('div', 'warnbar');
    warn.append(el('span', null, '⚠'));
    const wt = el('div');
    wt.append(el('b', null, 'New secret issued. '));
    wt.append(document.createTextNode(
      'The previous secret stops working immediately. ' + m.name + ' keeps its current session, ' +
      'but the next time it joins it is refused until its config carries this value.'));
    warn.append(wt);
    body.append(warn);
  }

  const managed = r.source === 'managed';
  body.append(kv([
    ['Node id', '#' + r.node_id],
    ['Source', managed ? 'managed — issued from this console' : 'network config'],
    ['Disabled', r.disabled ? 'yes' : 'no'],
  ]));

  if (r.secret) {
    const box = el('div', 'secret-box', r.secret);
    body.append(box);
    const bar = el('div', 'bar');
    bar.style.margin = '14px 0 4px';
    const copy = el('button', 'primary', 'Copy secret');
    const done = el('span', 'msg');
    copy.onclick = async () => {
      try {
        await navigator.clipboard.writeText(r.secret);
        done.textContent = 'Copied to clipboard';
      } catch {
        // Clipboard access needs a secure context, which plain HTTP is not.
        const sel = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(box);
        sel.removeAllRanges(); sel.addRange(range);
        done.textContent = 'Selected — copy with ' +
          (navigator.platform.includes('Mac') ? '⌘C' : 'Ctrl+C');
      }
    };
    bar.append(copy, done);
    body.append(bar);

    body.append(el('h2', null, 'Member configuration'));
    const cfg = el('div', 'wrap');
    cfg.append(el('div', 'cfg',
      `network_id = "${net}"\n` +
      `secret = "${r.secret}"`));
    body.append(cfg);
    body.append(el('p', 'note',
      'A member is its node id plus this secret; both are needed to join. Prefer a secret file ' +
      'in production so the value is not kept in the config itself.'));
  } else {
    body.append(el('div', 'empty', managed
      ? 'No secret is stored for this member.'
      : 'This member authenticates with the secret from the network config, which is not readable here. ' +
        'Regenerate to give it a managed secret instead.'));
  }

  body.append(el('h2', null, 'Actions'));
  const acts = el('div', 'bar');
  const regen = el('button', 'primary', 'Regenerate');
  regen.onclick = () => confirmModal({
    title: 'Regenerate the secret for ' + m.name + '?',
    sub: net + ' · #' + m.node_id,
    lead: 'A new secret is issued and shown here. This is also how a lost secret is recovered.',
    details: [
      'The current secret stops working immediately',
      m.online
        ? m.name + ' is ONLINE — it keeps running until it next joins, then is refused until updated'
        : m.name + ' cannot join until its config carries the new secret',
      managed ? 'The managed secret is replaced' : 'The config secret is no longer accepted once a managed one exists',
    ],
    danger: 'Regenerate',
    onConfirm: async () => {
      const n = await api(memberPath(net, m) + '/secret', { method: 'POST' });
      const b = openModal(m.name, `secret · #${m.node_id} · ${net}`);
      paintSecret(b, net, m, { node_id: n.node_id, secret: n.secret, source: 'managed', disabled: r.disabled }, true);
      return true; // keep the modal open with the new secret in it
    },
  });
  acts.append(regen);
  if (managed) {
    const rm = el('button', 'danger', 'Remove managed secret');
    rm.onclick = () => confirmModal({
      title: 'Remove the managed secret for ' + m.name + '?',
      sub: net + ' · #' + m.node_id,
      lead: 'The managed secret is deleted. This is not the same as disabling the member: it ' +
            'falls back to the secret in its network config, if it has one.',
      details: [
        'If ' + m.name + ' has a config secret it can still join with it',
        'If it has none, it cannot join at all until a secret is issued again',
        'Disable instead if the intent is to keep it out',
      ],
      danger: 'Remove managed secret',
      onConfirm: async () => {
        await api(memberPath(net, m) + '/secret', { method: 'DELETE' });
        msg('Removed the managed secret for ' + m.name);
        refresh();
      },
    });
    acts.append(rm);
  }
  body.append(acts);
}

/* ---------- stats: the N x N traffic matrix ---------- */

function relaysOf(st) {
  return st.members.filter(m => m.role === 'relay').sort((a, b) => a.node_id - b.node_id);
}

function trafficIndex(st) {
  // relay name -> its reported row, and (src,dst) -> link.
  const rows = new Map(), links = new Map();
  for (const r of (st.relay_traffic || [])) {
    rows.set(r.relay, r);
    for (const l of r.links) links.set(r.relay + ' ' + l.peer, l);
  }
  return { rows, links };
}

function matrixPane(st) {
  const pane = el('div');
  const relays = relaysOf(st);
  pane.append(netHeading(st, 'Fleet traffic'));

  if (!relays.length) { pane.append(el('div', 'empty', 'No relays in this network.')); return pane; }

  const idx = trafficIndex(st);
  if (!idx.rows.size) {
    pane.append(el('div', 'empty',
      'No relay has reported traffic yet. Reports arrive every 5 seconds from relays with a live control session.'));
    return pane;
  }

  pane.append(el('p', 'note',
    'Row is the sending relay, column the receiving one. Each cell is what the row relay measured on that link: ' +
    '↑ bytes it sent, ↓ bytes it received. Every link therefore appears twice — a gap between one relay’s ' +
    '↑ and its peer’s ↓ is loss on that link. The diagonal is traffic switched between two members ' +
    'attached to the same relay, which crosses no link at all. Counters are cumulative since each relay started.'));

  // Scale the heat to the largest single number in the matrix, on a log
  // curve — linear shading would leave everything but the busiest link
  // invisible.
  let peak = 0;
  for (const l of idx.links.values()) peak = Math.max(peak, l.tx_bytes, l.rx_bytes);
  for (const r of idx.rows.values()) peak = Math.max(peak, r.local_bytes);
  // Log position, then cubed. Log alone is far too flat here: traffic
  // spans nine orders of magnitude, so a 1 MiB link and a 500 GiB one
  // land within a few percent of each other and the whole matrix reads
  // as one uniform block. Cubing restores the contrast that makes the
  // busy links findable at a glance.
  const heat = v => {
    if (!v || !peak) return 0;
    const t = Math.log(v + 1) / Math.log(peak + 1);
    return .03 + .35 * t * t * t;
  };

  const t = el('table', 'matrix');
  const thead = el('thead'), htr = el('tr');
  const corner = el('th', 'corner', 'src \\ dst');
  htr.append(corner);
  relays.forEach(r => {
    const th = el('th');
    th.append(el('div', null, r.name));
    th.append(el('div', 'tiny muted', '#' + r.node_id));
    htr.append(th);
  });
  thead.append(htr); t.append(thead);

  const tb = el('tbody');
  for (const src of relays) {
    const tr = el('tr');
    const th = el('th');
    th.append(el('div', null, src.name));
    const row = idx.rows.get(src.name);
    th.append(el('div', 'tiny muted', row ? `${row.age_secs}s ago` : 'no report'));
    tr.append(th);

    for (const dst of relays) {
      const td = el('td');
      if (src.node_id === dst.node_id) {
        // Diagonal: locally switched, never crossed a mesh link.
        td.className = 'diag';
        const v = row ? row.local_bytes : 0;
        if (v) {
          td.append(shade(heat(v)));
          const c = el('div', 'cell');
          c.append(el('div', 'up', fmtBytes(v)));
          c.append(el('div', 'dn', fmtPkts(row.local_pkts) + ' pkts'));
          td.append(c);
          td.title = `${src.name} switched ${fmtBytes(v)} between members attached to it`;
        } else {
          td.append(el('span', 'zero', '·'));
        }
        tr.append(td);
        continue;
      }
      const link = idx.links.get(src.name + ' ' + dst.name);
      if (!link || (!link.tx_bytes && !link.rx_bytes)) {
        td.append(el('span', 'zero', link ? '0' : '—'));
        td.title = link ? 'Link exists, nothing sent yet' : 'No mesh link reported between these relays';
        if (link && !link.up) td.className = 'down';
        tr.append(td);
        continue;
      }
      td.append(shade(heat(Math.max(link.tx_bytes, link.rx_bytes))));
      if (!link.up) td.className = 'down';
      const c = el('div', 'cell');
      c.append(el('div', 'up', '↑ ' + fmtBytes(link.tx_bytes)));
      c.append(el('div', 'dn', '↓ ' + fmtBytes(link.rx_bytes)));
      const rate = [link.tx_bps && '↑' + fmtRate(link.tx_bps),
                    link.rx_bps && '↓' + fmtRate(link.rx_bps)].filter(Boolean).join('  ');
      if (rate) c.append(el('div', 'rate', rate));
      td.append(c);
      td.title = `${src.name} → ${dst.name} (#${link.peer_node_id})\n` +
                 `sent ${fmtBytes(link.tx_bytes)} (${fmtPkts(link.tx_pkts)} pkts)\n` +
                 `received ${fmtBytes(link.rx_bytes)} (${fmtPkts(link.rx_pkts)} pkts)\n` +
                 (link.up ? 'link up' : 'link DOWN — these are historical totals');
      tr.append(td);
    }
    tb.append(tr);
  }
  t.append(tb);
  const wrap = el('div', 'wrap'); wrap.append(t);
  pane.append(wrap);

  const legend = el('div', 'legend');
  const sw = (bg, label) => { const s = el('span'); const b = el('i', 'sw'); b.style.background = bg;
    s.append(b, document.createTextNode(label)); return s; };
  legend.append(sw('rgba(var(--heat),.28)', 'busier link'));
  legend.append(sw('var(--sunk)', 'diagonal — switched locally, no link crossed'));
  const dead = el('span'); const db = el('i', 'sw');
  db.style.cssText = 'border:1px dashed var(--warn);background:transparent';
  dead.append(db, document.createTextNode('link currently down'));
  legend.append(dead);
  pane.append(legend);

  // Per-relay totals, which the matrix alone does not add up for you.
  pane.append(el('h2', null, 'Relay totals'));
  const rows = relays.map(r => {
    const row = idx.rows.get(r.name);
    const tr = el('tr');
    tr.append(el('td', null, r.name));
    if (!row) {
      const td = el('td', 'muted'); td.colSpan = 6; td.textContent = 'no report yet';
      tr.append(td); return tr;
    }
    const tx = row.links.reduce((a, l) => a + l.tx_bytes, 0);
    const rx = row.links.reduce((a, l) => a + l.rx_bytes, 0);
    const txr = row.links.reduce((a, l) => a + l.tx_bps, 0);
    const rxr = row.links.reduce((a, l) => a + l.rx_bps, 0);
    tr.append(el('td', null, fmtBytes(tx)));
    tr.append(el('td', null, fmtBytes(rx)));
    tr.append(el('td', 'muted', [fmtRate(txr), fmtRate(rxr)].filter(Boolean).join(' / ') || '—'));
    tr.append(el('td', null, fmtBytes(row.local_bytes)));
    tr.append(el('td', null, fmtBytes(row.terminated_bytes)));
    tr.append(el('td', 'muted tiny', row.links.filter(l => l.up).length + ' up'));
    return tr;
  });
  pane.append(table(['Relay','Mesh sent','Mesh received','Rate now','Switched locally','Terminated here','Links'], rows));
  return pane;
}

function shade(alpha) {
  const d = el('div', 'heat');
  d.style.opacity = alpha;
  return d;
}

/* ---------- topology ---------- */

function topologyPane(st) {
  const pane = el('div');
  pane.append(netHeading(st, 'Topology'));
  const relays = relaysOf(st);
  if (!relays.length) { pane.append(el('div', 'empty', 'No relays in this network.')); return pane; }

  pane.append(el('p', 'note',
    'Relays form a full mesh; every client attaches to exactly one of them and reaches everyone else through it. ' +
    'Line weight follows how much traffic a link has carried. Click any node for its details.'));

  const idx = trafficIndex(st);
  const byRelay = new Map(relays.map(r => [r.name, []]));
  const unattached = [];
  for (const m of st.members) {
    if (m.role === 'relay') continue;
    if (m.attached_relay && byRelay.has(m.attached_relay)) byRelay.get(m.attached_relay).push(m);
    else if (m.online) unattached.push(m);
  }

  const W = 940, H = 700, cx = W/2, cy = H/2 - 10;
  const R = relays.length === 1 ? 0 : Math.min(185, 92 + relays.length * 24);
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' });

  const pos = new Map();
  relays.forEach((r, i) => {
    const a = -Math.PI/2 + (i * 2 * Math.PI) / relays.length;
    pos.set(r.name, { x: cx + R * Math.cos(a), y: cy + R * Math.sin(a), a });
  });

  // Links first, so nodes paint over them.
  let peak = 0;
  for (const l of idx.links.values()) peak = Math.max(peak, l.tx_bytes + l.rx_bytes);
  const drawn = new Set();
  for (const a of relays) for (const b of relays) {
    if (a.node_id >= b.node_id) continue;
    const key = a.name + ' ' + b.name;
    if (drawn.has(key)) continue;
    drawn.add(key);
    const ab = idx.links.get(a.name + ' ' + b.name);
    const ba = idx.links.get(b.name + ' ' + a.name);
    if (!ab && !ba) continue;
    const vol = (ab ? ab.tx_bytes + ab.rx_bytes : 0) + (ba ? ba.tx_bytes + ba.rx_bytes : 0);
    const up = (ab && ab.up) || (ba && ba.up);
    const p1 = pos.get(a.name), p2 = pos.get(b.name);
    const w = peak ? 1.2 + 6 * (Math.log(vol + 1) / Math.log(peak * 2 + 1)) : 1.2;
    const line = svgEl('line', {
      x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
      class: 'link' + (up ? '' : ' dead'),
      'stroke-width': w.toFixed(2), 'stroke-opacity': up ? 0.42 : 0.3,
    });
    const t = svgEl('title');
    t.textContent = `${a.name} ↔ ${b.name}\n${fmtBytes(vol)} total\n${up ? 'up' : 'DOWN'}`;
    line.append(t);
    svg.append(line);
  }

  // Clients, drawn on a short arc away from the circle centre.
  relays.forEach(r => {
    const p = pos.get(r.name);
    const kids = byRelay.get(r.name) || [];
    const online = kids.filter(k => k.online);
    const outward = relays.length === 1 ? -Math.PI/2 : p.a;
    online.forEach((c, i) => {
      // 0.5 rad between neighbours keeps dots and their labels apart at
      // this radius; anything tighter and two clients on one relay
      // overlap into an unreadable blob. Alternating the radius buys
      // room for the labels once a relay carries more than a handful.
      const spread = Math.min(2.6, 0.5 * (online.length - 1));
      const a = outward - spread/2 + (online.length === 1 ? 0 : spread * i / (online.length - 1));
      const rad = 84 + (i % 2) * 28;
      const cxx = p.x + rad * Math.cos(a), cyy = p.y + rad * Math.sin(a);
      svg.append(svgEl('line', {
        x1: p.x, y1: p.y, x2: cxx, y2: cyy,
        stroke: 'currentColor', 'stroke-opacity': .22, 'stroke-width': 1,
      }));
      const g = svgEl('g', { class: 'node' });
      g.append(svgEl('circle', { cx: cxx, cy: cyy, r: 9, fill: 'var(--accent2)', 'fill-opacity': .85 }));
      const lbl = svgEl('text', { x: cxx, y: cyy + 22, class: 'clabel' });
      lbl.textContent = c.name.length > 14 ? c.name.slice(0, 13) + '…' : c.name;
      g.append(lbl);
      const t = svgEl('title');
      t.textContent = `${c.name} (#${c.node_id})\n${addrOf(c) || 'no address'}`;
      g.append(t);
      g.onclick = () => showMember(st, c);
      svg.append(g);
    });
  });

  // Relay nodes.
  relays.forEach(r => {
    const p = pos.get(r.name);
    const kids = (byRelay.get(r.name) || []).filter(k => k.online).length;
    const g = svgEl('g', { class: 'node' });
    g.append(svgEl('circle', {
      cx: p.x, cy: p.y, r: 30,
      fill: r.online ? 'var(--accent)' : 'var(--off)', 'fill-opacity': r.online ? .16 : .1,
    }));
    g.append(svgEl('circle', {
      class: 'ring', cx: p.x, cy: p.y, r: 30, fill: 'none',
      stroke: r.online ? 'var(--accent)' : 'var(--off)', 'stroke-width': 2,
      'stroke-dasharray': r.online ? '' : '4 4',
    }));
    const count = svgEl('text', { x: p.x, y: p.y + 5, class: 'nlabel' });
    count.textContent = kids;
    g.append(count);
    const name = svgEl('text', { x: p.x, y: p.y + 48, class: 'nlabel' });
    name.textContent = r.name;
    g.append(name);
    const sub = svgEl('text', { x: p.x, y: p.y + 63, class: 'nsub' });
    sub.textContent = r.ip4 || ('#' + r.node_id);
    g.append(sub);
    const t = svgEl('title');
    t.textContent = `${r.name} (#${r.node_id})\n${kids} client(s) attached\n${r.online ? 'online' : 'offline'}`;
    g.append(t);
    g.onclick = () => showRelay(st, r);
    svg.append(g);
  });

  const map = el('div', 'map'); map.append(svg);
  pane.append(map);

  // Attachment list: the same facts as the picture, in a form that can be
  // scanned and copied.
  const clients = st.members.filter(m => m.role !== 'relay');
  if (clients.length) {
    pane.append(el('h2', null, 'Attachments'));
    pane.append(table(['Member','Node','State','Attached relay','VPN address','Heartbeat'], clients.map(m => {
      const tr = el('tr');
      tr.append(el('td', null, m.name));
      const c = el('td'); c.append(el('code', null, '#' + m.node_id)); tr.append(c);
      const s = el('td'); s.append(pill(m)); tr.append(s);
      tr.append(el('td', m.attached_relay ? '' : 'muted', m.attached_relay || '—'));
      const ip = el('td'); ip.append(el('code', null, addrOf(m) || '—')); tr.append(ip);
      tr.append(el('td', 'muted tiny', m.last_heartbeat_unix ? fmtAge(m.last_heartbeat_unix) + ' ago' : '—'));
      return tr;
    })));
  }

  if (unattached.length) {
    pane.append(el('h2', null, 'Online but attached to no relay'));
    pane.append(table(['Member','Node','VPN address'], unattached.map(m => {
      const tr = el('tr');
      tr.append(el('td', null, m.name));
      const c = el('td'); c.append(el('code', null, '#' + m.node_id)); tr.append(c);
      const ip = el('td'); ip.append(el('code', null, addrOf(m) || '—'));
      tr.append(ip);
      return tr;
    })));
  }
  return pane;
}

/* ---------- modal ---------- */

function openModal(title, sub) {
  $('#modal-title').textContent = title;
  $('#modal-sub').textContent = sub || '';
  const body = $('#modal-body'); body.replaceChildren();
  $('#overlay').hidden = false;
  return body;
}
function closeModal() { $('#overlay').hidden = true; }
$('#modal-close').onclick = closeModal;
$('#overlay').onclick = e => { if (e.target === $('#overlay')) closeModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/// Ask before something irreversible. `details` is a list of consequences
/// the operator should see *before* deciding, not after. If `onConfirm`
/// resolves to true it has put something else in the modal and the modal
/// stays open.
function confirmModal({ title, sub, lead, details, danger, onConfirm }) {
  const body = openModal(title, sub);
  body.append(el('p', 'note', lead));
  if (details && details.length) {
    const ul = el('ul', 'clist');
    details.forEach(d => { const li = el('li'); li.append(el('span', null, d)); ul.append(li); });
    body.append(ul);
  }
  const bar = el('div', 'bar');
  bar.style.marginTop = '18px';
  const go = el('button', 'danger', danger || 'Confirm');
  go.style.fontWeight = '600';
  const cancel = el('button', null, 'Cancel');
  go.onclick = async () => {
    go.disabled = true; cancel.disabled = true;
    try { const keep = await onConfirm(); if (!keep) closeModal(); }
    catch (e) { msg('' + e.message, true); closeModal(); }
  };
  cancel.onclick = closeModal;
  bar.append(go, cancel);
  body.append(bar);
}

function kv(pairs) {
  const d = el('dl', 'kv');
  for (const [k, v] of pairs) {
    if (v === undefined || v === null || v === '') continue;
    d.append(el('dt', null, k), el('dd', null, v));
  }
  return d;
}

function commonRows(st, m) {
  const v = viewState(st, m);
  return [
    ['Node id', '#' + m.node_id],
    ['VPN address', addrOf(m) || '—'],
    ['Routed CIDRs', (m.registered_cidrs || []).join(' ') || '—'],
    ['Disabled', m.disabled ? 'yes' : 'no'],
    ['View', v.label + (m.reported_gen === undefined ? '' : ` (network gen ${st.gen}, digest ${m.digest_ok ? 'ok' : 'MISMATCH'})`)],
    ['Heartbeat', m.last_heartbeat_unix ? fmtAge(m.last_heartbeat_unix) + ' ago · ' + fmtTime(m.last_heartbeat_unix) : '—'],
    ['Last join', m.last_join_unix ? fmtTime(m.last_join_unix) + ' from ' + (m.last_join_from || 'unknown') : 'never'],
    ['Login gen', m.login_gen],
    ['Replaced', m.replaced_unix ? 'from ' + (m.replaced_from || 'unknown') + ' at ' + fmtTime(m.replaced_unix) : undefined],
  ];
}

function showRelay(st, r) {
  const body = openModal(r.name, `relay · #${r.node_id} · ${r.online ? 'online' : 'offline'}`);
  const idx = trafficIndex(st);
  const row = idx.rows.get(r.name);
  const kids = st.members.filter(m => m.role !== 'relay' && m.attached_relay === r.name);
  const online = kids.filter(k => k.online);

  body.append(kv([
    ...commonRows(st, r),
    ['Dialable', r.advertised_reachable || 'unknown'],
    ['Mesh sent', row ? fmtBytes(row.links.reduce((a, l) => a + l.tx_bytes, 0)) : '—'],
    ['Mesh received', row ? fmtBytes(row.links.reduce((a, l) => a + l.rx_bytes, 0)) : '—'],
    ['Switched locally', row ? fmtBytes(row.local_bytes) : '—'],
    ['Terminated here', row ? fmtBytes(row.terminated_bytes) : '—'],
  ]));

  body.append(el('h2', null, `Attached clients (${online.length})`));
  if (!online.length) {
    body.append(el('div', 'empty', 'No clients are attached to this relay right now.'));
  } else {
    const ul = el('ul', 'clist');
    for (const c of online.sort((a, b) => a.name.localeCompare(b.name))) {
      const li = el('li');
      li.append(el('span', 'nm', c.name));
      li.append(el('code', 'tiny muted', '#' + c.node_id));
      li.append(el('span', 'ips', addrOf(c) || 'no address'));
      ul.append(li);
    }
    body.append(ul);
  }

  const offline = kids.filter(k => !k.online);
  if (offline.length) {
    body.append(el('h2', null, `Last seen here, now offline (${offline.length})`));
    const ul = el('ul', 'clist');
    for (const c of offline) {
      const li = el('li');
      li.append(el('span', 'nm muted', c.name));
      li.append(el('span', 'ips', addrOf(c) || '—'));
      ul.append(li);
    }
    body.append(ul);
  }

  if (row && row.links.length) {
    body.append(el('h2', null, 'Mesh links'));
    body.append(table(['Peer','Sent','Received','Rate now','State'], row.links.map(l => {
      const tr = el('tr');
      const p = el('td'); p.append(document.createTextNode(l.peer + ' '), el('code', 'tiny muted', '#' + l.peer_node_id)); tr.append(p);
      tr.append(el('td', null, fmtBytes(l.tx_bytes)));
      tr.append(el('td', null, fmtBytes(l.rx_bytes)));
      tr.append(el('td', 'muted', [fmtRate(l.tx_bps), fmtRate(l.rx_bps)].filter(Boolean).join(' / ') || '—'));
      const s = el('td'); s.append(el('span', 'pill ' + (l.up ? 'on' : 'offl'), l.up ? 'up' : 'down'));
      tr.append(s);
      return tr;
    })));
  }
}

function showMember(st, m) {
  const body = openModal(m.name, `${m.role} · #${m.node_id} · ${m.online ? 'online' : 'offline'}`);
  body.append(kv([
    ...commonRows(st, m),
    ['Attached relay', m.attached_relay || '—'],
  ]));
  const bar = el('div', 'bar');
  if (m.attached_relay) {
    const relay = st.members.find(r => r.name === m.attached_relay);
    if (relay) {
      const b = el('button', null, `Open ${relay.name}`);
      b.onclick = () => showRelay(st, relay);
      bar.append(b);
    }
  }
  const sec = el('button', null, 'Show secret');
  sec.onclick = () => showSecret(st.network_id, m);
  bar.append(sec);
  body.append(bar);
}

/* ---------- tabs + refresh ---------- */

function selectTab(name) {
  activeTab = name;
  document.querySelectorAll('.tabs button').forEach(b =>
    b.setAttribute('aria-selected', b.dataset.tab === name ? 'true' : 'false'));
  ['status','topology','stats'].forEach(t =>
    $('#pane-' + t).hidden = (t !== name));
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => selectTab(b.dataset.tab));
selectTab(activeTab);

function statusPane(st) {
  const pane = el('div');
  pane.append(netHeading(st));
  pane.append(el('p', 'note',
    'A member is a node id plus a secret. "View" is the generation of the network table the member ' +
    'last reported applying, checked against the coordinator\'s current gen ' + st.gen + '.'));
  pane.append(table(
    ['Member','Node','Role','State','VPN address','Routes','Relay','Heartbeat','View','Last join','Actions'],
    st.members.map(m => memberRow(st, m))));

  pane.append(netHeading(st, 'Prefix ownership'));
  const prefixes = st.prefix_table || [];
  if (!prefixes.length) {
    pane.append(el('div', 'empty', 'No prefixes are registered in this network.'));
  } else {
    pane.append(table(['Prefix','Owner','Standby (age order)'], prefixes.map(p => {
      const tr = el('tr');
      const c = el('td'); c.append(el('code', null, p.cidr)); tr.append(c);
      const o = el('td'); o.append(document.createTextNode(p.owner + ' '), el('code', 'tiny muted', '#' + p.owner_node_id)); tr.append(o);
      tr.append(el('td', 'muted tiny', (p.standby || []).join(', ') || '—'));
      return tr;
    })));
  }
  return pane;
}

async function refresh() {
  if (!token) { msg('Enter the admin token to connect.'); return; }
  try {
    const global = await api('/api/v1/status');
    const totals = global.networks.reduce((a, n) => ({
      m: a.m + n.members_total, o: a.o + n.members_online, r: a.r + n.relays_total }), {m:0,o:0,r:0});

    const statuses = [];
    for (const n of global.networks) statuses.push(await api(`/api/v1/networks/${enc(n.network_id)}/status`));
    snapshot = statuses;

    let fleetBytes = 0;
    for (const st of statuses)
      for (const row of (st.relay_traffic || []))
        fleetBytes += row.links.reduce((a, l) => a + l.tx_bytes, 0) + row.local_bytes;

    const cards = el('div');
    const transport = statuses.length
      ? statuses[0].transport + (statuses[0].transport === 'stream' && statuses[0].lanes > 1
          ? ` ×${statuses[0].lanes}` : '')
      : '—';
    [['Networks', global.networks.length], ['Members', totals.m], ['Online', totals.o],
     ['Relays', totals.r], ['Fleet traffic', fmtBytes(fleetBytes)], ['Transport', transport]
    ].forEach(([l, n]) => {
      const c = el('div', 'card'); c.append(el('div', 'n', n), el('div', 'l', l)); cards.append(c);
    });
    // Swapped in one go, only once every value is known: clearing before
    // the per-network fetches would blank the cards on every refresh.
    $('#cards').replaceChildren(...cards.children);

    const status = el('div'), stats = el('div'), topo = el('div');
    for (const st of statuses) {
      status.append(statusPane(st));
      stats.append(matrixPane(st));
      topo.append(topologyPane(st));
    }
    if (!statuses.length) status.append(el('div', 'empty', 'No networks are configured.'));
    $('#pane-status').replaceChildren(...status.children);
    $('#pane-stats').replaceChildren(...stats.children);
    $('#pane-topology').replaceChildren(...topo.children);

    msg('Updated ' + new Date().toLocaleTimeString());
  } catch (e) { msg('' + e.message, true); }
}

$('#save').onclick = () => { token = $('#token').value.trim(); refresh(); };
$('#token').onkeydown = e => { if (e.key === 'Enter') $('#save').click(); };
$('#reload').onclick = async () => {
  try { const r = await api('/api/v1/reload', { method: 'POST' });
    let t = `Reloaded: ${(r.reloaded || []).join(', ') || 'none'}`;
    if (r.ignored_new_networks?.length) t += ` — ignored new network(s): ${r.ignored_new_networks.join(', ')}`;
    if (r.warnings?.length) { t += ` — ${r.warnings.length} warning(s)`; console.warn(r.warnings); }
    msg(t);
    refresh();
  } catch (e) { msg('' + e.message, true); }
};
setInterval(() => { $('#clock').textContent = new Date().toLocaleTimeString(); }, 1000);
setInterval(() => {
  // Refreshing under an open modal, or while someone is entering text,
  // throws away what they were doing. Neither is worth five seconds of
  // freshness.
  const busy = ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName);
  if ($('#overlay').hidden && !busy) refresh();
}, 5000);
refresh();
</script>
