<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NetQ VPN coordinator</title>
<style>
:root{--bg:#f6f7fa;--fg:#1c1d23;--muted:#676a78;--line:#e1e3ea;--card:#fff;--sunk:#f0f1f5;
      --ok:#0a7a44;--okbg:#e3f4ea;--off:#8a8a96;--offbg:#eeeef2;--warn:#a4571a;--warnbg:#fdf1e3;
      --bad:#b3261e;--badbg:#fbe9e7;
      --accent:#2456c9;--accent2:#7d3fd1;--heat:36,86,201;--shadow:0 1px 3px rgba(0,0,0,.07),0 8px 24px rgba(0,0,0,.06);
      --side:236px}
@media (prefers-color-scheme:dark){
:root{--bg:#121318;--fg:#ececf1;--muted:#9a9ca8;--line:#2a2b34;--card:#1a1b22;--sunk:#15161c;
      --ok:#54d19a;--okbg:#14301f;--off:#8a8a96;--offbg:#232329;--warn:#e0a35c;--warnbg:#33240f;
      --bad:#ff7b72;--badbg:#3a1a17;
      --accent:#7ea2ff;--accent2:#b48cff;--heat:126,162,255;--shadow:0 1px 3px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
     font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
[hidden]{display:none!important}
a{color:var(--accent)}
h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
   margin:26px 0 10px;font-weight:600;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
h2:first-child{margin-top:4px}
h2 .gen{font-weight:700;color:var(--accent);text-transform:none;letter-spacing:0}
h2 .uuid{font-weight:400;text-transform:none;letter-spacing:0;font-family:ui-monospace,Menlo,monospace;font-size:11px}
h3{font-size:15px;margin:0 0 6px;font-weight:640}
.sub{color:var(--muted);font-size:13px}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.note{color:var(--muted);font-size:13px;margin:-4px 0 12px;max-width:74ch}
code{font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);
       border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
button.danger{border-color:var(--warn);color:var(--warn)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover{filter:brightness(1.08);color:#fff}
button.ghost{border-color:transparent;background:transparent}
input,select,textarea{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);
      border-radius:8px;background:var(--card);color:var(--fg);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea{min-height:72px;font-family:ui-monospace,Menlo,monospace;font-size:13px;resize:vertical}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;font-weight:600}
.field{margin-bottom:14px}
.help{font-size:12px;color:var(--muted);margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
.msg{font-size:13px;color:var(--muted)}
.err{color:var(--bad)}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.on{background:var(--okbg);color:var(--ok)}
.offl{background:var(--offbg);color:var(--off)}
.dis{background:var(--warnbg);color:var(--warn)}
.warnpill{background:var(--warnbg);color:var(--warn)}
.badpill{background:var(--badbg);color:var(--bad)}
.rolepill{background:var(--sunk);color:var(--muted);font-weight:600}
.subline{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.subline.warn{color:var(--warn)}
.name{cursor:pointer;font-weight:560}
.name:hover{color:var(--accent)}
.actions{display:flex;gap:5px;flex-wrap:nowrap}
.actions button{padding:4px 9px;font-size:12.5px}

/* ---- login ---- */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.login .card{width:100%;max-width:380px;padding:28px 28px 22px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));
      display:inline-block;flex:none;position:relative}
.logo::after{content:"";position:absolute;inset:8px;border:2px solid #fff;border-radius:50%;opacity:.9}
.brand .t{font-weight:700;letter-spacing:-.01em}
.brand .s{font-size:12px;color:var(--muted);display:block;margin-top:-2px}

/* ---- shell ---- */
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);
     background:var(--card);position:sticky;top:0;z-index:20}
.top .spacer{flex:1}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--off);display:inline-block}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px var(--okbg)}
.dot.bad{background:var(--warn);box-shadow:0 0 0 3px var(--warnbg)}
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:calc(100% - 52px)}
.side{border-right:1px solid var(--line);background:var(--card);padding:14px 12px;display:flex;flex-direction:column;gap:6px}
.side .h{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:4px 8px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;color:var(--fg);text-decoration:none;font-size:14px}
.nav a:hover{background:var(--sunk)}
.nav a.active{background:var(--sunk);color:var(--accent);font-weight:600}
.nav a .cnt{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px}
.side .foot button{width:100%}
main{padding:20px 24px 70px;min-width:0}
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--muted)}
.crumbs a{text-decoration:none}
.title{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.title h1{font-size:22px}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{border-right:none;border-bottom:1px solid var(--line);flex-direction:row;align-items:center;overflow-x:auto;gap:8px;padding:8px 12px}
  .side .h{display:none}
  .nav{flex-direction:row}
  .nav a{white-space:nowrap}
  .side .foot{margin-top:0;margin-left:auto;flex-direction:row;padding-top:0}
  .side .foot button{width:auto}
  main{padding:16px 14px 60px}
  .top{padding:10px 12px}
  .hide-sm{display:none!important}
}

/* ---- cards ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card .n{font-size:24px;font-weight:640;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.card .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.netcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.netcard{cursor:pointer;transition:border-color .12s}
.netcard:hover{border-color:var(--accent)}
.netcard .nm{font-weight:650;font-size:16px;display:flex;align-items:center;gap:8px}
.netcard .facts{display:flex;gap:16px;margin-top:10px;font-size:13px;color:var(--muted)}
.netcard .facts b{color:var(--fg);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:13px;padding:18px;text-align:center;border:1px dashed var(--line);border-radius:10px}
.hero{padding:34px 22px;text-align:center}
.hero p{max-width:56ch;margin:8px auto 18px;color:var(--muted)}

/* ---- tables ---- */
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;
   letter-spacing:.04em;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
tr:last-child td{border-bottom:none}

/* ---- tabs ---- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs a{border:none;background:none;border-radius:0;padding:9px 14px;color:var(--muted);text-decoration:none;
        font-weight:560;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:14px}
.tabs a:hover{color:var(--fg)}
.tabs a.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ---- traffic matrix ---- */
.matrix{border-collapse:separate;border-spacing:0;font-size:13px;width:auto;min-width:100%}
.matrix th,.matrix td{border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.matrix th:last-child,.matrix td:last-child{border-right:none}
.matrix thead th{position:sticky;top:0;background:var(--card);z-index:2;text-align:center;padding:9px 12px}
.matrix tbody th{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;
                 text-transform:none;font-size:13px;letter-spacing:0;color:var(--fg);font-weight:600}
.matrix td{padding:8px 12px;text-align:right;font-variant-numeric:tabular-nums;position:relative}
.matrix .corner{background:var(--card);z-index:3;left:0}
.cell{display:flex;flex-direction:column;gap:1px;align-items:flex-end;position:relative;z-index:1}
.cell .up{color:var(--fg);font-weight:560}
.cell .dn{color:var(--muted);font-size:12px}
.cell .rate{color:var(--accent);font-size:11px;font-weight:600}
.zero{color:var(--muted);opacity:.45}
.diag{background:var(--sunk)}
.heat{position:absolute;inset:0;background:rgb(var(--heat));z-index:0;pointer-events:none}
.down{outline:1px dashed var(--warn);outline-offset:-2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}

/* ---- topology ---- */
.map{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.node{cursor:pointer}
.node:hover .ring{stroke-width:3}
.nlabel{font:600 13px ui-sans-serif,system-ui,sans-serif;fill:var(--fg);text-anchor:middle}
.nsub{font:11px ui-monospace,Menlo,monospace;fill:var(--muted);text-anchor:middle}
.clabel{font:10px ui-sans-serif,system-ui,sans-serif;fill:var(--muted);text-anchor:middle}
.link{stroke:var(--accent);stroke-linecap:round}
.link.dead{stroke:var(--off);stroke-dasharray:5 5;opacity:.4}

/* ---- modal ---- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;
         justify-content:center;padding:24px;z-index:50;backdrop-filter:blur(2px)}
.modal{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
       max-width:680px;width:100%;max-height:88vh;overflow:auto}
.modal header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid var(--line);
              position:sticky;top:0;background:var(--card);border-radius:14px 14px 0 0;z-index:1}
.modal .body{padding:18px 22px 22px}
@media (max-width:640px){.overlay{padding:0;align-items:stretch}.modal{max-height:100vh;border-radius:0;max-width:none}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13px;margin-bottom:18px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
.clist{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.clist li{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line);font-size:13px}
.clist li:last-child{border-bottom:none}
.clist .nm{font-weight:560}
.clist .ips{margin-left:auto;font-family:ui-monospace,Menlo,monospace;color:var(--muted);font-size:12px}
.tokenbox{border:1px solid var(--accent);border-radius:10px;background:var(--sunk);
          padding:14px 16px;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
          word-break:break-all;user-select:all}
.warnbar{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:9px;
         background:var(--warnbg);color:var(--warn);font-size:13px;line-height:1.5;margin-bottom:14px}
.warnbar b{font-weight:680}
.cfg{padding:14px;font:12.5px/1.6 ui-monospace,Menlo,monospace;white-space:pre;overflow-x:auto;user-select:all;
     background:var(--sunk);border:1px solid var(--line);border-radius:9px}
.danger-zone{border:1px solid var(--warn);border-radius:10px;padding:14px 16px;margin-top:26px}
</style>
</head>
<body>

<div id="login" class="login" hidden>
  <div class="card">
    <div class="brand"><span class="logo"></span><div><span class="t">NetQ VPN</span><span class="s">coordinator</span></div></div>
    <form id="loginForm" style="margin-top:22px">
      <div class="field"><label for="lu">User</label><input id="lu" autocomplete="username" required></div>
      <div class="field"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required></div>
      <div class="row"><button class="primary" type="submit" id="loginBtn">Sign in</button><span class="msg err" id="loginErr"></span></div>
    </form>
    <p class="note" style="margin-top:18px">No login configured? Set <code>[admin] user</code> and <code>password_hash</code> in
      <code>coordinator.toml</code> (<code>nqvpn-coord hash-password</code>).</p>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="brand"><span class="logo"></span><div><span class="t">NetQ VPN</span><span class="s hide-sm">coordinator</span></div></div>
    <span class="live"><span class="dot" id="dot"></span><span id="liveText">connecting</span></span>
    <span class="spacer"></span>
    <span class="msg" id="msg"></span>
    <span class="sub hide-sm" id="clock"></span>
    <span class="sub" id="who"></span>
    <button class="ghost" id="logout">Sign out</button>
  </header>
  <div class="shell">
    <nav class="side">
      <div class="h">Networks</div>
      <div class="nav" id="nav"></div>
      <div class="foot">
        <button class="primary" id="newNet">+ New network</button>
        <button id="exportBtn">Export</button>
        <button id="importBtn">Import</button>
      </div>
    </nav>
    <main id="view"></main>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <header>
      <h1 id="modal-title"></h1>
      <span class="sub" id="modal-sub"></span>
      <span class="spacer" style="flex:1"></span>
      <button id="modal-close">Close</button>
    </header>
    <div class="body" id="modal-body"></div>
  </div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c;
  if (txt !== undefined && txt !== null) e.textContent = txt; return e; };
const svgEl = (t, attrs = {}) => { const e = document.createElementNS('http://www.w3.org/2000/svg', t);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
const enc = encodeURIComponent;

/* ---------- state ---------- */
/** The latest live frame: { networks: [summary], status: {id: NetworkStatus} }. */
let frame = { networks: [], status: {} };
let route = { page: 'home' };
let ws = null, wsBackoff = 1000, staleWhileBusy = false;

function msg(text, isErr) { const m = $('#msg'); m.textContent = text; m.className = isErr ? 'msg err' : 'msg';
  if (!isErr) setTimeout(() => { if (m.textContent === text) m.textContent = ''; }, 6000); }

async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (opts.body && typeof opts.body !== 'string') { opts = { ...opts, body: JSON.stringify(opts.body) }; headers['Content-Type'] = 'application/json'; }
  const r = await fetch(path, { ...opts, headers, credentials: 'same-origin' });
  if (r.status === 401) { showLogin(); throw new Error('signed out'); }
  if (!r.ok) {
    let detail = 'HTTP ' + r.status;
    try { const b = await r.json(); if (b.error) detail = b.error.message || b.error.code; } catch {}
    throw new Error(detail);
  }
  return r.json();
}
const netPath = id => `/api/v1/networks/${enc(id)}`;
const memberPath = (net, name) => `${netPath(net)}/members/${enc(name)}`;

/* ---------- formatting ---------- */
const UNITS = ['B','KiB','MiB','GiB','TiB','PiB'];
function fmtBytes(n) { if (!n) return '0'; let v = n, i = 0; while (v >= 1024 && i < UNITS.length - 1) { v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(2)) + ' ' + UNITS[i]; }
const RUNITS = ['bps','kbps','Mbps','Gbps','Tbps'];
function fmtRate(bytesPerSec) { if (!bytesPerSec) return ''; let v = bytesPerSec * 8, i = 0;
  while (v >= 1000 && i < RUNITS.length - 1) { v /= 1000; i++; } return (i === 0 ? Math.round(v) : v.toFixed(1)) + ' ' + RUNITS[i]; }
function fmtPkts(n) { if (n < 1000) return n + ''; if (n < 1e6) return (n/1e3).toFixed(1) + 'K'; if (n < 1e9) return (n/1e6).toFixed(1) + 'M'; return (n/1e9).toFixed(2) + 'G'; }
const nowUnix = () => Math.floor(Date.now() / 1000);
function fmtAge(unix) { if (!unix) return '—'; const s = Math.max(0, nowUnix() - unix);
  if (s < 60) return s + 's'; if (s < 3600) return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
  if (s < 86400) return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
  return Math.floor(s / 86400) + 'd ' + Math.floor((s % 86400) / 3600) + 'h'; }
const fmtTime = unix => unix ? new Date(unix * 1000).toLocaleString() : '—';
// A generation number is epoch milliseconds — the time the snapshot took
// effect. Show it as a time (with the raw number on hover).
function fmtGen(gen) {
  if (!gen || gen < 1e12) return 'gen ' + gen; // pre-clock / test value
  const d = new Date(gen);
  // Time alone for a snapshot from today; the date too when it's older,
  // so an old snapshot never reads as a bare, ambiguous time-of-day.
  const label = d.toDateString() === new Date().toDateString() ? d.toLocaleTimeString() : d.toLocaleString();
  const s = el('span', null, 'as of ' + label);
  s.title = d.toLocaleString() + '  ·  generation ' + gen;
  return s;
}
const addrOf = m => [m.ip4, m.ip6].filter(Boolean).join('  ');

/* ---------- shared bits ---------- */
function pill(m) {
  if (m.disabled) return el('span', 'pill dis', 'disabled');
  if (!m.node_id) return el('span', 'pill offl', 'never joined');
  return m.online ? el('span', 'pill on', 'online') : el('span', 'pill offl', 'offline');
}
function viewState(st, m) {
  if (m.reported_gen === undefined || m.reported_gen === null) return { cls: 'muted', label: 'no report', title: 'This member has not reported which generation it applied yet.' };
  const g = m.reported_gen, cur = st.gen;
  if (g === cur && m.digest_ok) return { cls: 'pill on', label: 'OK · gen ' + g, title: 'Applied the current generation and its digest matches.' };
  if (g < cur) return { cls: 'pill warnpill', label: `behind · ${g} / ${cur}`, title: `Applied generation ${g}; the network is at ${cur}. It should catch up on its next heartbeat.` };
  if (g > cur) return { cls: 'pill badpill', label: `mismatch · ${g} > ${cur}`, title: `Reports generation ${g}, newer than the coordinator's ${cur}. Usually a coordinator restart; the next push fixes it.` };
  return { cls: 'pill badpill', label: 'mismatch · gen ' + g, title: 'Generation matches but the digest does not: the member holds a different table than this coordinator sent.' };
}
function viewCell(st, m) { const v = viewState(st, m); const s = el('span', v.cls, v.label); s.title = v.title; return s; }
function table(headers, rows) {
  const wrap = el('div', 'wrap'); const t = el('table');
  const thead = el('thead'), htr = el('tr'); headers.forEach(h => htr.append(el('th', null, h))); thead.append(htr); t.append(thead);
  const tb = el('tbody'); rows.forEach(r => tb.append(r)); t.append(tb); wrap.append(t); return wrap;
}
function heading(st, label) {
  const h = el('h2'); h.append(el('span', null, label));
  const g = el('span', 'gen'); g.append(fmtGen(st.gen)); h.append(g);
  return h;
}
function field(labelText, input, help) {
  const f = el('div', 'field'); const l = el('label', null, labelText); f.append(l, input);
  if (help) f.append(el('div', 'help', help)); return f;
}

// CIDR helpers. The coordinator masks host bits off before saving; these

function ipToBig(ip) {

  let bs = -1, bl = 0, cs = -1, cl = 0;

/* ---------- live feed ---------- */
function setLive(state, text) { $('#dot').className = 'dot ' + state; $('#liveText').textContent = text; }
function connectWs() {
  if (ws) return;
  const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/api/v1/ws';
  setLive('', 'connecting');
  let sock;
  try { sock = new WebSocket(url); } catch { scheduleReconnect(); return; }
  ws = sock;
  sock.onopen = () => { wsBackoff = 1000; setLive('ok', 'live'); };
  sock.onmessage = ev => {
    let f; try { f = JSON.parse(ev.data); } catch { return; }
    if (f.type !== 'status') return;
    frame = f;
    // Re-rendering under an open modal or while typing throws away what
    // the operator is doing; hold the frame and paint it afterwards.
    const busy = !$('#overlay').hidden || ['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName);
    if (busy) { staleWhileBusy = true; renderNav(); } else render();
  };
  sock.onclose = async () => {
    ws = null;
    // A refused upgrade looks like any other drop; ask whether the
    // session is still good before retrying forever.
    try { const r = await fetch('/api/v1/me', { credentials: 'same-origin' }); if (r.status === 401) { showLogin(); return; } } catch {}
    scheduleReconnect();
  };
  sock.onerror = () => {};
}
function scheduleReconnect() {
  setLive('bad', 'reconnecting');
  setTimeout(() => { if (!$('#app').hidden) connectWs(); }, wsBackoff);
  wsBackoff = Math.min(wsBackoff * 2, 10000);
}
document.addEventListener('focusout', () => { if (staleWhileBusy && $('#overlay').hidden) { staleWhileBusy = false; render(); } });

    // (172.26.0.0/20) with a typo'd address. Show what will be saved and
    // let the operator confirm, rather than silently rewriting it.
    const fixes = raw.map(c => ({ orig: c, norm: cidrNetwork(c) })).filter(x => x.norm && x.norm !== x.orig);
    if (fixes.length) {

      confirmModal({
        title: 'Normalize routed ' + (fixes.length > 1 ? 'CIDRs?' : 'CIDR?'),
        sub: existing ? existing.name : 'new member',
        lead: 'These have host bits set. They are saved as their network address — confirm, or cancel to fix the input yourself.',
        details: fixes.map(x => x.orig + '  →  ' + x.norm),
        danger: 'Normalize & save',
        onConfirm: async () => { await submit(normalized); return true; }, // confirmModal toasts on throw
      });
      return; // the confirm dialog owns the flow now
    }
    try { await submit(raw); } catch (ex) { err.textContent = ex.message; save.disabled = false; }
  };
  body.append(f);

}

/* ---------- stats: the N x N traffic matrix ---------- */
function relaysOf(st) { return st.members.filter(m => m.role === 'relay' && m.node_id).sort((a, b) => a.node_id - b.node_id); }
function trafficIndex(st) {
  const rows = new Map(), links = new Map();
  for (const r of (st.relay_traffic || [])) { rows.set(r.relay, r); for (const l of r.links) links.set(r.relay + ' ' + l.peer, l); }
  return { rows, links };
}
function matrixPane(st) {

  const idx = trafficIndex(st);

  pane.append(el('p', 'note', 'Row is the sending relay, column the receiving one. Each cell is what the row relay measured on that link: ↑ bytes it sent, ↓ bytes it received. Every link therefore appears twice — a gap between one relay’s ↑ and its peer’s ↓ is loss on that link. The diagonal is traffic switched between two members attached to the same relay. Counters are cumulative since each relay started.'));
  let peak = 0;
  for (const l of idx.links.values()) peak = Math.max(peak, l.tx_bytes, l.rx_bytes);
  for (const r of idx.rows.values()) peak = Math.max(peak, r.local_bytes);
  const heat = v => { if (!v || !peak) return 0; const t = Math.log(v + 1) / Math.log(peak + 1); return .03 + .35 * t * t * t; };
  const t = el('table', 'matrix');
  const thead = el('thead'), htr = el('tr'); htr.append(el('th', 'corner', 'src \\ dst'));
  relays.forEach(r => { const th = el('th'); th.append(el('div', null, r.name)); th.append(el('div', 'tiny muted', '#' + r.node_id)); htr.append(th); });
  thead.append(htr); t.append(thead);
  const tb = el('tbody');
  for (const src of relays) {
    const tr = el('tr'); const th = el('th'); th.append(el('div', null, src.name));
    const row = idx.rows.get(src.name); th.append(el('div', 'tiny muted', row ? `${row.age_secs}s ago` : 'no report')); tr.append(th);
    for (const dst of relays) {
      const td = el('td');
      if (src.node_id === dst.node_id) {
        td.className = 'diag'; const v = row ? row.local_bytes : 0;
        if (v) { td.append(shade(heat(v))); const c = el('div', 'cell'); c.append(el('div', 'up', fmtBytes(v))); c.append(el('div', 'dn', fmtPkts(row.local_pkts) + ' pkts')); td.append(c);
          td.title = `${src.name} switched ${fmtBytes(v)} between members attached to it`; }
        else td.append(el('span', 'zero', '·'));
        tr.append(td); continue;
      }
      const link = idx.links.get(src.name + ' ' + dst.name);
      if (!link || (!link.tx_bytes && !link.rx_bytes)) { td.append(el('span', 'zero', link ? '0' : '—')); td.title = link ? 'Link exists, nothing sent yet' : 'No mesh link reported between these relays'; if (link && !link.up) td.className = 'down'; tr.append(td); continue; }
      td.append(shade(heat(Math.max(link.tx_bytes, link.rx_bytes)))); if (!link.up) td.className = 'down';
      const c = el('div', 'cell'); c.append(el('div', 'up', '↑ ' + fmtBytes(link.tx_bytes))); c.append(el('div', 'dn', '↓ ' + fmtBytes(link.rx_bytes)));
      const rate = [link.tx_bps && '↑' + fmtRate(link.tx_bps), link.rx_bps && '↓' + fmtRate(link.rx_bps)].filter(Boolean).join('  ');
      if (rate) c.append(el('div', 'rate', rate)); td.append(c);
      td.title = `${src.name} → ${dst.name} (#${link.peer_node_id})\nsent ${fmtBytes(link.tx_bytes)} (${fmtPkts(link.tx_pkts)} pkts)\nreceived ${fmtBytes(link.rx_bytes)} (${fmtPkts(link.rx_pkts)} pkts)\n` + (link.up ? 'link up' : 'link DOWN — these are historical totals');
      tr.append(td);
    }
    tb.append(tr);
  }
  t.append(tb); const wrap = el('div', 'wrap'); wrap.append(t); pane.append(wrap);
  const legend = el('div', 'legend');
  const sw = (bg, label) => { const s = el('span'); const b = el('i', 'sw'); b.style.background = bg; s.append(b, document.createTextNode(label)); return s; };
  legend.append(sw('rgba(var(--heat),.28)', 'busier link')); legend.append(sw('var(--sunk)', 'diagonal — switched locally, no link crossed'));
  const dead = el('span'); const db = el('i', 'sw'); db.style.cssText = 'border:1px dashed var(--warn);background:transparent'; dead.append(db, document.createTextNode('link currently down')); legend.append(dead);
  pane.append(legend);
  pane.append(el('h2', null, 'Relay totals'));
  pane.append(table(['Relay','Mesh sent','Mesh received','Rate now','Switched locally','Terminated here','Links'], relays.map(r => {
    const row = idx.rows.get(r.name); const tr = el('tr'); tr.append(el('td', null, r.name));
    if (!row) { const td = el('td', 'muted'); td.colSpan = 6; td.textContent = 'no report yet'; tr.append(td); return tr; }
    const tx = row.links.reduce((a, l) => a + l.tx_bytes, 0), rx = row.links.reduce((a, l) => a + l.rx_bytes, 0);
    const txr = row.links.reduce((a, l) => a + l.tx_bps, 0), rxr = row.links.reduce((a, l) => a + l.rx_bps, 0);
    tr.append(el('td', null, fmtBytes(tx)), el('td', null, fmtBytes(rx)), el('td', 'muted', [fmtRate(txr), fmtRate(rxr)].filter(Boolean).join(' / ') || '—'),
      el('td', null, fmtBytes(row.local_bytes)), el('td', null, fmtBytes(row.terminated_bytes)), el('td', 'muted tiny', row.links.filter(l => l.up).length + ' up'));
    return tr;
  })));
  return pane;
}

/* ---------- topology ---------- */
function topologyPane(st) {
  const pane = el('div');
  pane.append(heading(st, 'Topology'));
  const relays = relaysOf(st);
  if (!relays.length) { pane.append(el('div', 'empty', 'No relay has joined this network yet.')); return pane; }
  pane.append(el('p', 'note', 'Relays form a full mesh; every client attaches to exactly one of them and reaches everyone else through it. Line weight follows how much traffic a link has carried. Click any node for its details. Updates live.'));
  const idx = trafficIndex(st);
  const byRelay = new Map(relays.map(r => [r.name, []])); const unattached = [];
  for (const m of st.members) { if (m.role === 'relay') continue;
    if (m.attached_relay && byRelay.has(m.attached_relay)) byRelay.get(m.attached_relay).push(m); else if (m.online) unattached.push(m); }
  const W = 940, H = 700, cx = W/2, cy = H/2 - 10;
  const R = relays.length === 1 ? 0 : Math.min(185, 92 + relays.length * 24);
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' });
  const pos = new Map();
  relays.forEach((r, i) => { const a = -Math.PI/2 + (i * 2 * Math.PI) / relays.length; pos.set(r.name, { x: cx + R * Math.cos(a), y: cy + R * Math.sin(a), a }); });
  let peak = 0; for (const l of idx.links.values()) peak = Math.max(peak, l.tx_bytes + l.rx_bytes);
  const drawn = new Set();
  for (const a of relays) for (const b of relays) {
    if (a.node_id >= b.node_id) continue; const key = a.name + ' ' + b.name; if (drawn.has(key)) continue; drawn.add(key);
    const ab = idx.links.get(a.name + ' ' + b.name), ba = idx.links.get(b.name + ' ' + a.name); if (!ab && !ba) continue;
    const vol = (ab ? ab.tx_bytes + ab.rx_bytes : 0) + (ba ? ba.tx_bytes + ba.rx_bytes : 0); const up = (ab && ab.up) || (ba && ba.up);
    const p1 = pos.get(a.name), p2 = pos.get(b.name); const w = peak ? 1.2 + 6 * (Math.log(vol + 1) / Math.log(peak * 2 + 1)) : 1.2;
    const line = svgEl('line', { x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, class: 'link' + (up ? '' : ' dead'), 'stroke-width': w.toFixed(2), 'stroke-opacity': up ? 0.42 : 0.3 });
    const t = svgEl('title'); t.textContent = `${a.name} ↔ ${b.name}\n${fmtBytes(vol)} total\n${up ? 'up' : 'DOWN'}`; line.append(t); svg.append(line);
  }
  relays.forEach(r => {
    const p = pos.get(r.name); const kids = byRelay.get(r.name) || []; const online = kids.filter(k => k.online);
    const outward = relays.length === 1 ? -Math.PI/2 : p.a;
    online.forEach((c, i) => {

      const a = outward - spread/2 + (online.length === 1 ? 0 : spread * i / (online.length - 1));

      const t = svgEl('title'); t.textContent = `${c.name} (#${c.node_id})\n${addrOf(c) || 'no address'}`; g.append(t);
      g.onclick = () => showMember(st, c); svg.append(g);

  });
  relays.forEach(r => {
    const p = pos.get(r.name); const kids = (byRelay.get(r.name) || []).filter(k => k.online).length;
    const g = svgEl('g', { class: 'node' });

    const count = svgEl('text', { x: p.x, y: p.y + 5, class: 'nlabel' }); count.textContent = kids; g.append(count);
    const name = svgEl('text', { x: p.x, y: p.y + 48, class: 'nlabel' }); name.textContent = r.name; g.append(name);
    const sub = svgEl('text', { x: p.x, y: p.y + 63, class: 'nsub' }); sub.textContent = r.ip4 || ('#' + r.node_id); g.append(sub);
    const t = svgEl('title'); t.textContent = `${r.name} (#${r.node_id})\n${kids} client(s) attached\n${r.online ? 'online' : 'offline'}`; g.append(t);

    pane.append(table(['Member','State','Attached relay','Address','Heartbeat'], clients.map(m => {
      const tr = el('tr'); tr.append(el('td', null, m.name)); const s = el('td'); s.append(pill(m)); tr.append(s);
      tr.append(el('td', m.attached_relay ? '' : 'muted', m.attached_relay || '—'));

  if (unattached.length) {
    pane.append(el('h2', null, 'Online but attached to no relay'));
    pane.append(table(['Member','Address'], unattached.map(m => { const tr = el('tr'); tr.append(el('td', null, m.name)); const ip = el('td'); ip.append(el('code', null, addrOf(m) || '—')); tr.append(ip); return tr; })));
  }
  return pane;
}

/* ---------- modal ---------- */
function openModal(title, sub) { $('#modal-title').textContent = title; $('#modal-sub').textContent = sub || '';
  const body = $('#modal-body'); body.replaceChildren(); $('#overlay').hidden = false; return body; }
function closeModal() { $('#overlay').hidden = true; if (staleWhileBusy) { staleWhileBusy = false; render(); } }
$('#modal-close').onclick = closeModal;
$('#overlay').onclick = e => { if (e.target === $('#overlay')) closeModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function confirmModal({ title, sub, lead, details, danger, onConfirm }) {
  const body = openModal(title, sub); body.append(el('p', 'note', lead));
  if (details && details.length) { const ul = el('ul', 'clist'); details.forEach(d => { const li = el('li'); li.append(el('span', null, d)); ul.append(li); }); body.append(ul); }
  const bar = el('div', 'bar'); bar.style.marginTop = '18px';
  const go = el('button', 'danger', danger || 'Confirm'); go.style.fontWeight = '600'; const cancel = el('button', null, 'Cancel');
  go.onclick = async () => { go.disabled = true; cancel.disabled = true; try { const keep = await onConfirm(); if (!keep) closeModal(); } catch (e) { msg(e.message, true); closeModal(); } };
  cancel.onclick = closeModal; bar.append(go, cancel); body.append(bar);
}
function kv(pairs) { const d = el('dl', 'kv'); for (const [k, v] of pairs) { if (v === undefined || v === null || v === '') continue; d.append(el('dt', null, k), el('dd', null, v)); } return d; }
function commonRows(st, m) {
  const v = viewState(st, m);
  return [ ['Node id', m.node_id ? '#' + m.node_id : 'not joined yet'], ['Address', addrOf(m) || '—'], ['Routed CIDRs', (m.registered_cidrs || []).join(' ') || '—'],
    ['Disabled', m.disabled ? 'yes' : 'no'], ['View', v.label + (m.reported_gen === undefined ? '' : ` (network gen ${st.gen}, digest ${m.digest_ok ? 'ok' : 'MISMATCH'})`)],
    ['Heartbeat', m.last_heartbeat_unix ? fmtAge(m.last_heartbeat_unix) + ' ago · ' + fmtTime(m.last_heartbeat_unix) : '—'],
    ['Last join', m.last_join_unix ? fmtTime(m.last_join_unix) + ' from ' + (m.last_join_from || 'unknown') : 'never'], ['Login gen', m.login_gen],
    ['Replaced', m.replaced_unix ? 'from ' + (m.replaced_from || 'unknown') + ' at ' + fmtTime(m.replaced_unix) : undefined] ];
}
function showRelay(st, r) {
  const body = openModal(r.name, `relay · ${r.online ? 'online' : 'offline'}`);
  const idx = trafficIndex(st); const row = idx.rows.get(r.name);
  const kids = st.members.filter(m => m.role !== 'relay' && m.attached_relay === r.name); const online = kids.filter(k => k.online);
  body.append(kv([ ...commonRows(st, r), ['Dialable', r.advertised_reachable || 'unknown'],
    ['Mesh sent', row ? fmtBytes(row.links.reduce((a, l) => a + l.tx_bytes, 0)) : '—'], ['Mesh received', row ? fmtBytes(row.links.reduce((a, l) => a + l.rx_bytes, 0)) : '—'],
    ['Switched locally', row ? fmtBytes(row.local_bytes) : '—'], ['Terminated here', row ? fmtBytes(row.terminated_bytes) : '—'] ]));
  const bar = el('div', 'bar'); const t = el('button', null, 'Token'); t.onclick = () => showToken(st.network_id, r.name, false);
  const e = el('button', null, 'Edit'); e.onclick = () => memberForm(st, r); bar.append(t, e); body.append(bar);
  body.append(el('h2', null, `Attached clients (${online.length})`));
  if (!online.length) body.append(el('div', 'empty', 'No clients are attached to this relay right now.'));
  else { const ul = el('ul', 'clist'); for (const c of online.sort((a, b) => a.name.localeCompare(b.name))) { const li = el('li'); li.append(el('span', 'nm', c.name), el('code', 'tiny muted', '#' + c.node_id), el('span', 'ips', addrOf(c) || 'no address')); ul.append(li); } body.append(ul); }
  const offline = kids.filter(k => !k.online);
  if (offline.length) { body.append(el('h2', null, `Last seen here, now offline (${offline.length})`)); const ul = el('ul', 'clist'); for (const c of offline) { const li = el('li'); li.append(el('span', 'nm muted', c.name), el('span', 'ips', addrOf(c) || '—')); ul.append(li); } body.append(ul); }
  if (row && row.links.length) {
    body.append(el('h2', null, 'Mesh links'));
    body.append(table(['Peer','Sent','Received','Rate now','State'], row.links.map(l => { const tr = el('tr');
      const p = el('td'); p.append(document.createTextNode(l.peer + ' '), el('code', 'tiny muted', '#' + l.peer_node_id)); tr.append(p);
      tr.append(el('td', null, fmtBytes(l.tx_bytes)), el('td', null, fmtBytes(l.rx_bytes)), el('td', 'muted', [fmtRate(l.tx_bps), fmtRate(l.rx_bps)].filter(Boolean).join(' / ') || '—'));
      const s = el('td'); s.append(el('span', 'pill ' + (l.up ? 'on' : 'offl'), l.up ? 'up' : 'down')); tr.append(s); return tr; })));
  }
}
function showMember(st, m) {
  const body = openModal(m.name, `${m.role} · ${m.online ? 'online' : 'offline'}`);
  body.append(kv([ ...commonRows(st, m), ['Attached relay', m.attached_relay || '—'] ]));
  const bar = el('div', 'bar');
  if (m.attached_relay) { const relay = st.members.find(r => r.name === m.attached_relay); if (relay) { const b = el('button', null, `Open ${relay.name}`); b.onclick = () => showRelay(st, relay); bar.append(b); } }
  const t = el('button', null, 'Token'); t.onclick = () => showToken(st.network_id, m.name, false);
  const e = el('button', null, 'Edit'); e.onclick = () => memberForm(st, m); bar.append(t, e); body.append(bar);
}

/* ---------- boot ---------- */
setInterval(() => { $('#clock').textContent = new Date().toLocaleTimeString(); }, 1000);
(async () => {
  try { const me = await (await fetch('/api/v1/me', { credentials: 'same-origin' })).json(); if (me.user) { showApp(me.user); return; } } catch {}
  showLogin();
})();
</script>
</body>
