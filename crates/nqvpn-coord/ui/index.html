<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NetQ VPN coordinator</title>
<style>
:root{
  --bg:#edf2fa;--fg:#0f1b33;--muted:#5a6a86;--faint:#8b99b4;--line:#dbe3f0;--line2:#e8eef7;--card:#fff;--sunk:#f4f7fc;
  --ok:#0e9a62;--okbg:#e0f5ea;--off:#7f8da6;--offbg:#edf1f7;--warn:#b45309;--warnbg:#fdf0da;--bad:#d1342b;--badbg:#fde8e6;
  --accent:#2563eb;--accent-h:#1d4ed8;--accent2:#0ea5e9;--accentbg:#e7efff;--on-accent:#fff;--heat:37,99,235;
  --side-bg:linear-gradient(180deg,#0a1a3d 0%,#0e2a5e 100%);--side-fg:#c9d8f6;--side-muted:#7d93c0;--side-line:rgba(255,255,255,.08);
  --side-hover:rgba(255,255,255,.06);--side-active:rgba(96,165,250,.18);
  --glow:rgba(37,99,235,.10);
  --shadow-sm:0 1px 2px rgba(16,36,82,.06);
  --shadow:0 1px 2px rgba(16,36,82,.05),0 10px 28px -10px rgba(16,36,82,.18);
  --shadow-lg:0 30px 70px -18px rgba(8,22,58,.45);
  --r:14px;--side:252px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){
:root{
  --bg:#08101f;--fg:#e4ebf9;--muted:#8fa0c3;--faint:#62739a;--line:#1b2945;--line2:#15213a;--card:#0e1830;--sunk:#0b1428;
  --ok:#34d399;--okbg:#0d2e24;--off:#7c8cae;--offbg:#17223b;--warn:#fbbf24;--warnbg:#33260b;--bad:#f87171;--badbg:#3a1519;
  --accent:#60a5fa;--accent-h:#93c5fd;--accent2:#38bdf8;--accentbg:#11244a;--on-accent:#061229;--heat:96,165,250;
  --side-bg:linear-gradient(180deg,#060d1e 0%,#0a1633 100%);--glow:rgba(96,165,250,.08);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px -10px rgba(0,0,0,.5);--shadow-lg:0 30px 70px -18px rgba(0,0,0,.7)}}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--fg);background:radial-gradient(1100px 420px at 75% -160px,var(--glow),transparent 70%) no-repeat,var(--bg);
     font:14.5px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:var(--accent)}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.02em}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
   margin:28px 0 12px;font-weight:650;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
h2:first-child{margin-top:4px}
h2 .gen,.gen{font-weight:600;color:var(--accent);text-transform:none;letter-spacing:0}
h3{font-size:15px;margin:0 0 4px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.note{color:var(--muted);font-size:13px;margin:-2px 0 14px;max-width:78ch}
code{font:12.5px/1.4 var(--mono)}
.ic{flex:none;display:block}

/* ---- controls ---- */
button{font:inherit;font-size:13px;font-weight:550;height:34px;padding:0 13px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:7px;
       border-radius:10px;background:var(--card);color:var(--fg);cursor:pointer;white-space:nowrap;box-shadow:var(--shadow-sm);
       transition:background-color .12s,border-color .12s,color .12s,box-shadow .12s}
button:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));border-color:var(--accent);color:var(--on-accent);
               box-shadow:0 1px 2px rgba(16,36,82,.15),0 4px 12px -4px color-mix(in srgb,var(--accent) 60%,transparent)}
button.primary:hover{background:var(--accent-h);border-color:var(--accent-h);color:var(--on-accent)}
button.danger{color:var(--bad)}
button.danger:hover{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
button.ghost{border-color:transparent;background:transparent;box-shadow:none}
button.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:9px}
button.icon{width:30px;padding:0;justify-content:center}
input,select,textarea{font:inherit;font-size:14px;padding:8px 11px;border:1px solid var(--line);
      border-radius:10px;background:var(--card);color:var(--fg);width:100%;transition:border-color .12s,box-shadow .12s}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
input:disabled,select:disabled{background:var(--sunk);color:var(--muted)}
textarea{min-height:76px;font-family:var(--mono);font-size:13px;resize:vertical}
label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg);margin-bottom:6px;font-weight:600}
.field{margin-bottom:16px}
.help{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}
.tag{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--accentbg);color:var(--accent);font-weight:650;letter-spacing:.01em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}
.bar .spacer{flex:1}
.msg{font-size:13px;color:var(--muted)}
.err{color:var(--bad)}
a:focus-visible,button:focus-visible,[tabindex]:focus-visible,.node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:550;margin:0}
.switch input{appearance:none;-webkit-appearance:none;width:40px;height:22px;border-radius:999px;background:var(--line);position:relative;
              cursor:pointer;flex:none;padding:0;border:none;transition:background-color .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;
                     box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:21px}
details.more{border:1px solid var(--line);border-radius:12px;padding:0 16px;margin:4px 0 8px;background:var(--sunk)}
details.more>summary{cursor:pointer;padding:12px 0;font-weight:600;font-size:13px;list-style:none;display:flex;align-items:center;gap:8px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"›";display:inline-block;transition:transform .15s;color:var(--muted);font-size:16px;line-height:1}
details.more[open]>summary::before{transform:rotate(90deg)}
details.more>summary .muted{font-weight:400}
details.more[open]{padding-bottom:4px}

/* ---- pills ---- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.5}
.on{background:var(--okbg);color:var(--ok)}
.offl{background:var(--offbg);color:var(--off)}
.dis{background:var(--warnbg);color:var(--warn)}
.warnpill{background:var(--warnbg);color:var(--warn)}
.badpill{background:var(--badbg);color:var(--bad)}
.rolepill{background:var(--accentbg);color:var(--accent);font-weight:600}
.pill.on::before,.pill.offl::before,.pill.dis::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.on::before{box-shadow:0 0 0 3px color-mix(in srgb,currentColor 22%,transparent)}
@keyframes flash{from{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 45%,transparent)}to{box-shadow:0 0 0 4px transparent}}
.flash{animation:flash 1.4s ease-out}
.subline{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.subline.warn{color:var(--warn)}

/* ---- login ---- */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
       background:radial-gradient(900px 500px at 20% 0%,rgba(56,130,246,.35),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(14,165,233,.25),transparent 60%),#0a1a3d}
.login .card{width:100%;max-width:390px;padding:30px 30px 24px;box-shadow:var(--shadow-lg);border:none}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#0ea5e9);
      display:inline-block;flex:none;position:relative;box-shadow:0 4px 14px -4px rgba(14,165,233,.7)}
.logo::after{content:"";position:absolute;inset:9px;border:2.5px solid #fff;border-radius:50%}
.brand .t{font-weight:750;letter-spacing:-.01em;font-size:15px}
.brand .s{font-size:11.5px;color:var(--muted);display:block;margin-top:-2px}

/* ---- shell ---- */
#app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side-bg);color:var(--side-fg);
      display:flex;flex-direction:column;gap:6px;padding:18px 14px 14px}
.side .brand{padding:2px 6px 16px;border-bottom:1px solid var(--side-line);margin-bottom:10px}
.side .brand .t{color:#fff}
.side .brand .s{color:var(--side-muted)}
.side .h{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--side-muted);font-weight:650;padding:8px 10px 4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;color:var(--side-fg);text-decoration:none;font-size:14px;font-weight:500;position:relative}
.nav a:hover{background:var(--side-hover);color:#fff}
.nav a.active{background:var(--side-active);color:#fff;font-weight:600}
.nav a.active::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#60a5fa}
.nav a .hd{width:7px;height:7px;border-radius:50%;background:var(--side-muted);flex:none}
.nav a .hd.ok{background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.18)}
.nav a .hd.warn{background:#fbbf24}
.nav a .cnt{margin-left:auto;font-size:11.5px;color:var(--side-muted);font-variant-numeric:tabular-nums;background:rgba(255,255,255,.06);padding:0 7px;border-radius:999px}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:14px}
.side .foot .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side .foot button{width:100%;justify-content:center}
.side .foot button:not(.primary){background:rgba(255,255,255,.05);border-color:var(--side-line);color:var(--side-fg);box-shadow:none}
.side .foot button:not(.primary):hover{background:rgba(255,255,255,.1);color:#fff}
.side .me{display:flex;align-items:center;gap:10px;padding:12px 6px 2px;border-top:1px solid var(--side-line);margin-top:6px}
.side .me .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#0ea5e9);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;text-transform:uppercase;flex:none}
.side .me .u{font-size:13px;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis}
.side .me .u{flex:1;min-width:0;white-space:nowrap}
.side .foot .me button{margin-left:auto;width:auto;color:var(--side-muted);background:transparent;border-color:transparent}
.side .me button:hover{color:#fff;background:var(--side-hover)}
.mainwrap{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:10px 32px;position:sticky;top:0;z-index:20;
     background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);
     border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.top .spacer{flex:1}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-weight:550;
      background:var(--card);border:1px solid var(--line);padding:3px 10px 3px 9px;border-radius:999px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--off);display:inline-block}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px var(--okbg)}
.dot.bad{background:var(--warn);box-shadow:0 0 0 3px var(--warnbg)}
#clock{font-variant-numeric:tabular-nums}
main{padding:24px 32px 90px;width:100%;max-width:1480px}
#msg{position:fixed;right:22px;bottom:22px;z-index:60;max-width:min(440px,calc(100vw - 44px));padding:11px 16px;border-radius:12px;
     background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);font-size:13.5px;color:var(--fg);cursor:pointer;
     border-left:4px solid var(--ok);animation:toast .18s ease-out}
#msg.err{border-left-color:var(--bad)}
#msg:empty{display:none}
@keyframes toast{from{transform:translateY(8px);opacity:0}}
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.crumbs a{text-decoration:none;font-weight:550}
.phead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 18px}
.phead .chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);
      padding:2px 10px;border-radius:999px;font-weight:550}
.chip code{font-size:11.5px}
@media (max-width:860px){
  #app{display:block}
  .side{position:sticky;height:auto;z-index:30;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 12px}
  .side .nav{order:3;width:100%;overflow-x:auto;scrollbar-width:none}
  .side .brand{border:none;padding:0 6px 0 0;margin:0}
  .side .brand .s,.side .h,.side .me .u,.side .me .av{display:none}
  .nav{flex-direction:row}
  .nav a{white-space:nowrap}
  .nav a.active::before{display:none}
  .side .foot{margin:0 0 0 auto;flex-direction:row;padding:0}
  .side .foot .pair{display:flex}
  .side .foot button{width:auto}
  .side .me{border:none;margin:0;padding:0}
  .top{padding:8px 16px;position:static}
  main{padding:16px 16px 70px}
  .hide-sm{display:none!important}
}
@media (max-width:520px){.side .foot .pair{display:none}}

/* ---- cards ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow-sm)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin:14px 0 8px}
.stat{display:flex;align-items:center;gap:14px}
.stat .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accentbg);color:var(--accent);flex:none}
.stat .ico.ok{background:var(--okbg);color:var(--ok)}
.stat .n{white-space:nowrap;font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .l{color:var(--muted);font-size:12px;font-weight:550}
.netcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.netcard{cursor:pointer;transition:border-color .12s,box-shadow .15s,transform .15s}
.netcard:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));box-shadow:var(--shadow);transform:translateY(-2px)}
.netcard .nm{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.netcard .nm .gen{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:500}
.netcard .facts{display:flex;gap:18px;margin-top:12px;font-size:13px;color:var(--muted)}
.netcard .facts b{color:var(--fg);font-variant-numeric:tabular-nums;font-weight:650}
.meter{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden;margin-top:12px;border:1px solid var(--line2)}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),color-mix(in srgb,var(--ok) 70%,#fff));border-radius:999px;transition:width .4s ease}
.empty{color:var(--muted);font-size:13px;padding:22px;text-align:center;border:1.5px dashed var(--line);border-radius:12px;background:color-mix(in srgb,var(--card) 50%,transparent)}
.empty.spaced{margin-top:16px}
.hero{padding:40px 24px;text-align:center}
.hero p{max-width:56ch;margin:8px auto 20px;color:var(--muted)}
.hero button{margin:0 auto}

/* ---- tabs ---- */
.tabs{display:inline-flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:22px;
      max-width:100%;overflow-x:auto;box-shadow:var(--shadow-sm)}
.tabs a{padding:6px 14px;color:var(--muted);text-decoration:none;font-weight:600;border-radius:9px;white-space:nowrap;font-size:13.5px;
        display:inline-flex;align-items:center;gap:7px;transition:background-color .12s,color .12s}
.tabs a:hover{color:var(--fg);background:var(--sunk)}
.tabs a.active{background:var(--accent);color:var(--on-accent)}
.tabs a .cnt{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;padding:0 6px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.tabs a.active .cnt{background:rgba(255,255,255,.22);color:inherit}

/* ---- members ---- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.toolbar .spacer{flex:1}
.searchbox{position:relative;width:280px;max-width:100%}
.searchbox .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.searchbox input{padding-left:34px;height:34px;font-size:13.5px}
.seg{display:inline-flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:var(--shadow-sm)}
.seg button{height:26px;padding:0 10px;border:none;box-shadow:none;border-radius:7px;background:transparent;color:var(--muted);font-size:12.5px}
.seg button:hover{color:var(--fg);background:var(--sunk)}
.seg button.sel{background:var(--accentbg);color:var(--accent)}
.seg button .n{font-variant-numeric:tabular-nums;opacity:.75}
.seg button.warnseg.sel{background:var(--warnbg);color:var(--warn)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;
       position:relative;overflow:hidden;transition:box-shadow .15s,border-color .15s}
.mcard:hover{box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.mcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--st,var(--line))}
.mcard.st-on{--st:var(--ok)} .mcard.st-dis{--st:var(--warn)} .mcard.st-bad{--st:var(--bad)} .mcard.st-off{--st:var(--line)}
.mhead{display:flex;gap:12px;align-items:center;padding:14px 16px 12px;cursor:pointer}
.mhead:hover .mname{color:var(--accent)}
.avatar{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--accentbg);color:var(--accent)}
.avatar.relay{background:linear-gradient(135deg,#2563eb,#0ea5e9);color:#fff}
.mcard.st-off .avatar.relay,.mcard.st-dis .avatar.relay{background:var(--offbg);color:var(--off)}
.who{min-width:0;flex:1}
.mname{font-weight:650;font-size:15px;display:flex;align-items:baseline;gap:7px;letter-spacing:-.01em;transition:color .12s}
.mname span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nid{font:500 11.5px var(--mono);color:var(--faint)}
.maddr{font:12.5px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mfacts{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:0;padding:12px 16px;border-top:1px solid var(--line2)}
.mfacts div{min-width:0}
.mfacts .wide{grid-column:1/-1}
.mfacts dt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:650;margin-bottom:2px}
.mfacts dd{margin:0;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mfacts dd.muted{color:var(--muted);font-weight:400}
.mfacts dd.bad{color:var(--bad)}
.cidrs{display:flex;flex-wrap:wrap;gap:5px;white-space:normal}
.cidrs code{background:var(--sunk);border:1px solid var(--line2);border-radius:6px;padding:1px 7px;font-size:12px}
.routes{display:flex;flex-direction:column;gap:6px}
.pill.cidr{background:var(--accentbg);color:var(--accent);font:600 12px/1.5 var(--mono)}
.issues{margin:0 16px 12px;padding:8px 11px;border-radius:10px;background:var(--badbg);color:var(--bad);font-size:12.5px;line-height:1.45;display:flex;flex-direction:column;gap:3px}
.issues.warn{background:var(--warnbg);color:var(--warn)}
.issues div{display:flex;gap:7px;align-items:flex-start}
.issues .ic{margin-top:2px}
.mjoin{padding:0 16px 12px;font-size:12px;color:var(--faint)}
.mnote{margin:0 16px 10px;align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:550;
       color:var(--muted);background:var(--sunk);border:1px solid var(--line2);border-radius:999px;padding:2px 10px 2px 8px}
.mfoot{display:flex;gap:6px;align-items:center;padding:10px 12px;border-top:1px solid var(--line2);background:var(--sunk);margin-top:auto}
.mfoot .spacer{flex:1}
.mfoot button{box-shadow:none}

/* ---- tables ---- */
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow-sm)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:650;color:var(--faint);font-size:11px;text-transform:uppercase;background:var(--sunk);
   letter-spacing:.06em;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:top;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
tbody tr{transition:background-color .12s}
tbody tr:hover td{background:color-mix(in srgb,var(--accentbg) 45%,transparent)}
.matrix tbody tr:hover td{background:transparent}

/* ---- settings ---- */
.settings{display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px;align-items:start}
.snav{display:flex;flex-direction:column;gap:2px;position:sticky;top:70px}
.snav button{justify-content:flex-start;border:none;box-shadow:none;background:transparent;color:var(--muted);height:36px;font-size:13.5px}
.snav button:hover{background:var(--card);color:var(--fg)}
.snav button.active{background:var(--card);color:var(--accent);box-shadow:var(--shadow-sm);border:1px solid var(--line)}
.snav button.dz{color:var(--bad)}
.snav button .ic{opacity:.8}
.spanel{padding:22px 24px 8px;max-width:760px}
.spanel>h3{font-size:17px}
.spanel>.note{margin-bottom:20px}
.savebar{position:sticky;bottom:14px;display:flex;align-items:center;gap:10px;margin-top:14px;max-width:760px;
         padding:10px 12px 10px 18px;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.savebar .state{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.savebar.dirty .state{color:var(--warn);font-weight:600}
.savebar.dirty .state::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn)}
.savebar .spacer{flex:1}
@media (max-width:860px){.settings{grid-template-columns:1fr}.snav{flex-direction:row;overflow-x:auto;position:static}.spanel{padding:18px 16px 4px}}
.danger-zone{border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line));border-radius:12px;padding:16px 18px;margin:6px 0 16px;background:var(--badbg)}
.danger-zone p{margin:4px 0 14px;color:var(--fg);font-size:13px}

/* ---- member form ---- */
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.choice button{height:auto;padding:13px 14px;text-align:left;align-items:flex-start;white-space:normal;border-radius:12px;gap:11px;flex-direction:row}
.choice button .avatar{width:34px;height:34px}
.choice button b{display:block;font-size:14px;color:var(--fg)}
.choice button span.d{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px;line-height:1.4}
.choice button.sel{border-color:var(--accent);background:var(--accentbg);box-shadow:0 0 0 1px var(--accent) inset}
.fsec{margin:6px 0 4px}
.fsec>h4{margin:0 0 12px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700;display:flex;align-items:center;gap:10px}
.fsec>h4::after{content:"";flex:1;height:1px;background:var(--line2)}

/* ---- traffic matrix ---- */
.matrix{border-collapse:separate;border-spacing:0;font-size:13px;width:auto;min-width:100%}
.matrix th,.matrix td{border-bottom:1px solid var(--line2);border-right:1px solid var(--line2)}
.matrix th:last-child,.matrix td:last-child{border-right:none}
.matrix thead th{position:sticky;top:0;z-index:2;text-align:center;padding:9px 12px}
.matrix tbody th{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;
                 text-transform:none;font-size:13px;letter-spacing:0;color:var(--fg);font-weight:600}
.matrix td{padding:8px 12px;text-align:right;position:relative}
.matrix .corner{z-index:3;left:0}
.cell{display:flex;flex-direction:column;gap:1px;align-items:flex-end;position:relative;z-index:1}
.cell .up{color:var(--fg);font-weight:560}
.cell .dn{color:var(--muted);font-size:12px}
.cell .rate{color:var(--accent);font-size:11px;font-weight:600}
.zero{color:var(--muted);opacity:.45}
.diag{background:var(--sunk)}
.heat{position:absolute;inset:0;background:rgb(var(--heat));z-index:0;pointer-events:none}
.down{outline:1px dashed var(--warn);outline-offset:-2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}

/* ---- topology ---- */
.map{background:radial-gradient(600px 300px at 50% 45%,color-mix(in srgb,var(--accent) 7%,transparent),transparent),var(--card);
     border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-sm)}
.map svg{display:block;width:100%;height:auto}
.node{cursor:pointer}
.node:hover .ring{stroke-width:3}
.nlabel{font:600 13px Inter,ui-sans-serif,system-ui,sans-serif;fill:var(--fg);text-anchor:middle}
.nsub{font:11px var(--mono);fill:var(--muted);text-anchor:middle}
.clabel{font:10.5px Inter,ui-sans-serif,system-ui,sans-serif;fill:var(--muted);text-anchor:middle}
.link{stroke:var(--accent);stroke-linecap:round}
.link.dead{stroke:var(--off);stroke-dasharray:5 5;opacity:.4}

/* ---- modal ---- */
.overlay{position:fixed;inset:0;background:rgba(6,16,40,.5);display:flex;align-items:center;
         justify-content:center;padding:24px;z-index:50;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);
       max-width:680px;width:100%;max-height:88vh;overflow:auto;animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(6px) scale(.985);opacity:0}}
.modal header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 22px;border-bottom:1px solid var(--line2);
              position:sticky;top:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);z-index:1}
.modal header h1{font-size:17px}
.modal .body{padding:20px 22px 22px}
@media (max-width:640px){.overlay{padding:0;align-items:stretch}.modal{max-height:100vh;border-radius:0;max-width:none}.choice{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:13px;margin:0 0 18px;padding:14px 16px;border-radius:12px;background:var(--sunk);border:1px solid var(--line2)}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;word-break:break-word}
.clist{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.clist li{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line2);font-size:13px}
.clist li:last-child{border-bottom:none}
.clist .nm{font-weight:560}
.clist .ips{margin-left:auto;font-family:var(--mono);color:var(--muted);font-size:12px}
.tokenbox{border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:12px;background:var(--accentbg);
          padding:14px 16px;font:12.5px/1.6 var(--mono);word-break:break-all;user-select:all}
.warnbar{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;
         background:var(--okbg);color:var(--ok);font-size:13px;line-height:1.5;margin-bottom:14px}
.warnbar b{font-weight:680}
.cfg{padding:14px 16px;font:12.5px/1.65 var(--mono);white-space:pre;overflow-x:auto;user-select:all;margin:0 0 12px;
     background:#0b1530;color:#d6e2ff;border:1px solid var(--line);border-radius:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>

<div id="login" class="login" hidden>
  <div class="card">
    <div class="brand"><span class="logo"></span><div><span class="t">NetQ VPN</span><span class="s">coordinator</span></div></div>
    <h1 style="margin:26px 0 4px;font-size:20px">Sign in</h1>
    <p class="note" style="margin:0 0 18px">Manage your networks, members and relays.</p>
    <form id="loginForm">
      <div class="field"><label for="lu">User</label><input id="lu" autocomplete="username" required></div>
      <div class="field"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required></div>
      <button class="primary" type="submit" id="loginBtn" style="width:100%;justify-content:center;height:38px">Sign in</button>
      <div class="msg err" id="loginErr" style="margin-top:10px"></div>
    </form>
    <p class="note" style="margin:16px 0 0;font-size:12px">No login configured? Set <code>[admin] user</code> and <code>password_hash</code> in
      <code>coordinator.toml</code> (<code>nqvpn-coord hash-password</code>).</p>
  </div>
</div>

<div id="app" hidden>
  <nav class="side">
    <div class="brand"><span class="logo"></span><div><span class="t">NetQ VPN</span><span class="s">coordinator</span></div></div>
    <div class="h">Networks</div>
    <div class="nav" id="nav"></div>
    <div class="foot">
      <button class="primary" id="newNet">+ New network</button>
      <div class="pair"><button id="exportBtn">Export</button><button id="importBtn">Import</button></div>
      <div class="me"><span class="av" id="whoAv"></span><span class="u" id="who"></span><button class="ghost sm" id="logout" title="Sign out">Sign out</button></div>
    </div>
  </nav>
  <div class="mainwrap">
    <header class="top">
      <span class="live"><span class="dot" id="dot"></span><span id="liveText">connecting</span></span>
      <span class="spacer"></span>
      <span class="sub hide-sm" id="clock"></span>
    </header>
    <main id="view"></main>
  </div>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <header>
      <h1 id="modal-title"></h1>
      <span class="sub" id="modal-sub"></span>
      <span class="spacer" style="flex:1"></span>
      <button id="modal-close" class="sm">Close</button>
    </header>
    <div class="body" id="modal-body"></div>
  </div>
</div>

  const g = []; for (let i = 7; i >= 0; i--) g.push(Number((v >> BigInt(i * 16)) & 0xffffn));
  let bs = -1, bl = 0, cs = -1, cl = 0;
  for (let i = 0; i < 8; i++) { if (g[i] === 0) { if (cs < 0) cs = i; cl++; if (cl > bl) { bl = cl; bs = cs; } } else { cs = -1; cl = 0; } }
  if (bl > 1) return g.slice(0, bs).map(x => x.toString(16)).join(':') + '::' + g.slice(bs + bl).map(x => x.toString(16)).join(':');
  return g.map(x => x.toString(16)).join(':');
}
// The network address of a CIDR, or null if it doesn't parse. When the
// input carried host bits, the result differs from the input.
function cidrNetwork(s) {
  const m = s.trim().match(/^(.+)\/(\d+)$/); if (!m) return null;
  const p = ipToBig(m[1]); if (!p) return null;
  const pfx = parseInt(m[2], 10); if (pfx < 0 || pfx > p.bits) return null;
  const ones = (1n << BigInt(p.bits)) - 1n;
  const mask = pfx === 0 ? 0n : ones ^ ((1n << BigInt(p.bits - pfx)) - 1n);
  return bigToIp(p.v & mask, p.v6) + '/' + pfx;
}

/* ---------- live feed ---------- */

  setLive('', 'connecting');
  let sock;
  try { sock = new WebSocket(url); } catch { scheduleReconnect(); return; }
  ws = sock;
  sock.onopen = () => { wsBackoff = 1000; setLive('ok', 'live'); };
  sock.onmessage = ev => {
    let f; try { f = JSON.parse(ev.data); } catch { return; }
    if (f.type !== 'status') return;

  sock.onclose = async () => {

    // session is still good before retrying forever.

/* ---------- in-place patching ----------
 * Pages are built as fresh detached trees, then the live DOM is patched to
 * match rather than replaced. A node that did not change keeps its
 * identity, so a click, hover, text selection or scroll that spans a live
 * frame is not lost. Children carrying `data-key` are matched by key (rows
 * follow their member when the list reorders); the rest by position.
 * `data-keep` marks operator-owned subtrees (a form being edited) that
 * frames must leave alone. Live form state (typed values, selections) is a
 * property, not an attribute, so patching never clobbers it. */
const restyled = new WeakSet();
const HANDLERS = ['onclick', 'onchange', 'oninput', 'onsubmit', 'onkeydown'];
function patch(live, next) {
  if (live.nodeType !== 1) {
    if (live.nodeValue !== next.nodeValue) {
      live.nodeValue = next.nodeValue;
      const p = live.parentElement;
      if (p && p.classList.contains('pill') && !restyled.has(p)) { p.classList.remove('flash'); void p.offsetWidth; p.classList.add('flash'); }
    }
    return;
  }
  const keep = next.getAttribute('data-keep');
  if (keep !== null && live.getAttribute('data-keep') === keep) return;
  // A badge whose state class changed (behind → OK) swaps at once: the new
  // colour is the signal, and flashing it over the old one looks broken.
  if (live.classList.contains('pill') && live.className.replace(/\bflash\b/, '').trim() !== next.className.trim()) { live.classList.remove('flash'); restyled.add(live); }
  for (const a of [...live.attributes]) if (!next.hasAttribute(a.name)) live.removeAttribute(a.name);
  for (const a of next.attributes) if (live.getAttribute(a.name) !== a.value) live.setAttribute(a.name, a.value);
  // Handlers close over the frame they were built from; take the new ones.
  for (const h of HANDLERS) if (live[h] !== next[h]) live[h] = next[h];
  patchChildren(live, next);
  restyled.delete(live);
}
function patchChildren(live, next) {
  const keyed = new Map();
  for (const c of live.children) { const k = c.getAttribute('data-key'); if (k !== null) keyed.set(c.nodeName + '|' + k, c); }
  let cur = live.firstChild;
  for (const n of [...next.childNodes]) {
    const k = n.nodeType === 1 ? n.getAttribute('data-key') : null;
    let match = null;
    if (k !== null) { match = keyed.get(n.nodeName + '|' + k) || null; if (match) keyed.delete(n.nodeName + '|' + k); }
    else if (cur && cur.nodeType === n.nodeType && cur.nodeName === n.nodeName && !(cur.nodeType === 1 && cur.hasAttribute('data-key'))) match = cur;
    if (!match) { live.insertBefore(n, cur); continue; }
    if (match === cur) cur = cur.nextSibling; else live.insertBefore(match, cur);
    patch(match, n);
  }
  while (cur) { const x = cur.nextSibling; cur.remove(); cur = x; }
}

  foot.append(el('span', 'spacer'));
  const del = el('button', 'sm icon danger'); del.append(icon('trash', 15)); del.title = 'Delete ' + m.name; del.setAttribute('aria-label', 'Delete ' + m.name);
  del.onclick = () => confirmModal({
    title: 'Delete ' + m.name + '?', sub: net,
    lead: 'This forgets the member completely: its token stops working, its address is released, and any routes it owns are withdrawn. Use Disable to keep it out but keep its record.',
    details: [ m.online ? 'It is ONLINE now: its sessions are closed; it keeps retrying with backoff until it is enabled again or deleted' : 'It is offline',
      'Address ' + (addrOf(m) || 'none') + ' is released', routes.length ? 'Routes ' + routes.join(', ') + ' fail over to the next registrant' : 'It owns no routes' ],
    danger: 'Delete member',

/* ---------- member form (add / edit) ---------- */
async function memberForm(st, existing) {
  const net = st.network_id;
  const body = openModal(existing ? 'Edit ' + existing.name : 'Add member', existing ? `${net} · ${existing.role}` : net);
  let cur = {};
  if (existing) {
    body.append(el('div', 'empty', 'Loading…'));
    try { cur = await api(memberPath(net, existing.name)); } catch (e) { body.replaceChildren(el('div', 'empty', e.message)); return; }
    body.replaceChildren();
  }
  let roleVal = existing ? existing.role : 'client';
  const f = el('form');
  const name = inp(existing ? existing.name : '', { placeholder: 'e.g. laptop-1, home, cloud-3', pattern: '[A-Za-z0-9._-]{1,64}', required: '', autocomplete: 'off' });
  const choices = [];
  if (!existing) {
    const choice = el('div', 'choice');
    for (const [v, ic, title, desc] of [
      ['client', 'laptop', 'Client', 'A machine that joins the network: a laptop, a server, a phone.'],
      ['relay', 'server', 'Relay', 'Carries traffic for clients. Can route a LAN or be an internet exit.']]) {
      const b = el('button'); b.type = 'button';
      const av = el('div', 'avatar' + (v === 'relay' ? ' relay' : '')); av.append(icon(ic, 18));
      const tx = el('div'); tx.append(el('b', null, title), el('span', 'd', desc)); b.append(av, tx);
      b.onclick = () => { roleVal = v; sync(); };
      choices.push([v, b]); choice.append(b);
    }
    f.append(choice);
    f.append(field('Name', name, 'Letters, digits, . _ -  ·  permanent; it is what other members see.'));
  }

  const relayAddr = inp(cur.relay_addr ?? 'auto:4444', { placeholder: 'host:port or auto:port' });
  const cidrs = el('textarea'); cidrs.value = (cur.local_cidrs || []).join('\n'); cidrs.placeholder = '192.168.1.0/24\none per line';
  const exitGw = el('input'); exitGw.type = 'checkbox'; exitGw.checked = cur.internet_gateway === true;
  const ip4 = inp(cur.preferred_ip4 ?? '', { placeholder: 'automatic' });
  const ip6 = inp(cur.preferred_ip6 ?? '', { placeholder: 'automatic' });
  const wantIp = el('select'); [['', 'Yes (default)'], ['true', 'Yes'], ['false', 'No — headless']].forEach(([v, l]) => { const o = el('option', null, l); o.value = v; wantIp.append(o); });
  wantIp.value = cur.want_vpn_ip === null || cur.want_vpn_ip === undefined ? '' : String(cur.want_vpn_ip);
  const cap = inp(cur.max_session_mbps ?? '', { type: 'number', min: '0', placeholder: 'network default' });
  const pref = el('select'); const pnone = el('option', null, 'Lowest latency (automatic)'); pnone.value = ''; pref.append(pnone);
  st.members.filter(m => m.role === 'relay').forEach(r => { const o = el('option', null, r.name); o.value = r.name; if (cur.preferred_relay === r.name) o.selected = true; pref.append(o); });

  const section = title => { const s = el('div', 'fsec'); s.append(el('h4', null, title)); return s; };
  const relayBox = section('Relay');
  relayBox.append(field('Relay address', relayAddr, 'What the fleet and clients dial. auto:PORT = the address this relay joins from, on PORT.'));
  relayBox.append(field('Routed LANs', cidrs, 'Prefixes behind this relay, made reachable to every member. Two relays declaring the same prefix are a failover pair.'));
  const sw = el('label', 'switch'); sw.append(exitGw, el('span', null, 'Internet exit'));
  const swf = el('div', 'field'); swf.append(sw, el('div', 'help', 'Clients using --route-all can reach the internet through this relay. The host needs IP forwarding and a masquerade rule; the relay reports whether they are present.'));
  relayBox.append(swf);
  relayBox.append(field('Per-client cap (Mbps)', cap, 'Bandwidth cap for each attached client. Blank = network default, 0 = none.'));
  const clientBox = section('Connection');
  clientBox.append(field('Preferred relay', pref, 'Attached when reachable; otherwise the lowest-latency relay, moving back on its own when the preferred one returns.'));
  const addr = el('details', 'more');
  const custom = cur.preferred_ip4 || cur.preferred_ip6 || (cur.want_vpn_ip !== null && cur.want_vpn_ip !== undefined);
  addr.open = !!custom;
  const sum = el('summary'); sum.append(document.createTextNode('Tunnel address'), el('span', 'muted', custom ? '· customised' : '· automatic'));
  addr.append(sum);
  const g2 = el('div', 'grid2');
  g2.append(field('IPv4 address', ip4, 'Blank = allocated from the network’s IPv4 CIDR. A static address is never reassigned.'));
  g2.append(field('IPv6 address', ip6, 'Blank = allocated from the network’s IPv6 CIDR, if it has one.'));
  addr.append(g2, field('Give it an address', wantIp, 'Headless members carry no address (a pure forwarding relay).'));
  f.append(relayBox, clientBox, addr);
  const sync = () => {
    const r = roleVal === 'relay'; relayBox.hidden = !r; clientBox.hidden = r;
    for (const [v, b] of choices) b.className = v === roleVal ? 'sel' : '';
  };
  sync();

  const bar = el('div', 'bar'); const save = el('button', 'primary', existing ? 'Save & apply' : 'Create & get token'); const cancel = el('button', null, 'Cancel'); cancel.type = 'button';
  const err = el('span', 'msg err'); bar.append(save, cancel, err); f.append(bar);
  if (existing) f.append(el('p', 'note', 'Saving tells the member to re-join immediately; it applies the new facts without a restart.'));
  cancel.onclick = closeModal;
  // Send the member. Throws on failure so each caller can place the error
  // where the operator can see it (inline in the form, or via a toast when
  // the form has been replaced by the confirm dialog).
  const submit = async (localCidrs) => {
    const isRelay = roleVal === 'relay';
    // Give immediate feedback from the live status snapshot. The API
    // performs the authoritative check too (including offline soft
    // reservations and races after this form was opened).
    const requested = [
      ['IPv4', ip4.value.trim(), 'ip4'],
      ['IPv6', ip6.value.trim(), 'ip6'],
    ];
    for (const [family, raw, key] of requested) {
      if (!raw) continue;
      const parsed = ipToBig(raw);
      const wanted = parsed ? bigToIp(parsed.v, parsed.v6) : raw;
      const owner = st.members.find(m => m.name !== (existing?.name || name.value.trim()) && m[key] && (() => {
        const held = ipToBig(m[key]);
        return (held ? bigToIp(held.v, held.v6) : m[key]) === wanted;
      })());
      if (owner) throw new Error(`${family} address ${raw} is already assigned to ${owner.name}`);
    }
    const spec = {
      relay_addr: isRelay ? optStr(relayAddr.value.trim()) : null,
      local_cidrs: isRelay ? localCidrs : [],
      preferred_ip4: optStr(ip4.value.trim()), preferred_ip6: optStr(ip6.value.trim()),
      want_vpn_ip: wantIp.value === '' ? null : wantIp.value === 'true',
      max_session_mbps: isRelay ? optNum(cap.value.trim()) : null,
      preferred_relay: isRelay ? null : optStr(pref.value),
      internet_gateway: isRelay ? exitGw.checked : null,
    };
    if (existing) { await api(memberPath(net, existing.name), { method: 'PUT', body: spec }); msg('Saved ' + existing.name + '; it is re-joining'); closeModal(); }
    else { const r = await api(netPath(net) + '/members', { method: 'POST', body: { name: name.value.trim(), role: roleVal, ...spec } }); paintToken(openModal(r.name, net + ' · new ' + r.role), r, true); }
  };
  // A field the browser rejects may sit in the folded address section.
  f.addEventListener('invalid', e => { const d = e.target.closest('details'); if (d) d.open = true; }, true);
  f.onsubmit = async e => {
    e.preventDefault(); save.disabled = true; err.textContent = '';
    const isRelay = roleVal === 'relay';
    const raw = isRelay ? lines(cidrs.value) : [];
    // A routed LAN entered with host bits (172.26.6.59/20) is a network
    // (172.26.0.0/20) with a typo'd address. Show what will be saved and
    // let the operator confirm, rather than silently rewriting it.
    const fixes = raw.map(c => ({ orig: c, norm: cidrNetwork(c) })).filter(x => x.norm && x.norm !== x.orig);
    if (fixes.length) {
      const normalized = raw.map(c => { const f = fixes.find(x => x.orig === c); return f ? f.norm : c; });
      confirmModal({
        title: 'Normalize routed ' + (fixes.length > 1 ? 'CIDRs?' : 'CIDR?'),
        sub: existing ? existing.name : 'new member',
        lead: 'These have host bits set. They are saved as their network address — confirm, or cancel to fix the input yourself.',
        details: fixes.map(x => x.orig + '  →  ' + x.norm),
        danger: 'Normalize & save',
        onConfirm: async () => { await submit(normalized); return true; }, // confirmModal toasts on throw
      });
      return; // the confirm dialog owns the flow now
    }
    try { await submit(raw); } catch (ex) { err.textContent = ex.message; save.disabled = false; }
  };
  body.append(f);
  (existing ? (roleVal === 'relay' ? relayAddr : pref) : name).focus();
}

/* ---------- token ---------- */
async function showToken(net, name, fresh) {
  const body = openModal(name, net + ' · token');

}
function paintToken(body, r, fresh) {
  body.replaceChildren();
  if (fresh) { const w = el('div', 'warnbar'); w.append(el('span', null, '✓')); const t = el('div'); t.append(el('b', null, 'Token ready. '), document.createTextNode('Copy it to the machine. It can be shown again here any time; regenerating it invalidates this one immediately.')); w.append(t); body.append(w); }
  body.append(el('p', 'note', 'Everything about this member — network, name, role, address, routes — is looked up from the token at join. The machine holds nothing else.'));
  const box = el('div', 'tokenbox', r.token); body.append(box);
  const bar = el('div', 'bar');
  const copy = el('button', 'primary', 'Copy token');
  copy.onclick = async () => { try { await navigator.clipboard.writeText(r.token); copy.textContent = 'Copied'; } catch { const s = window.getSelection(); s.removeAllRanges(); const rg = document.createRange(); rg.selectNodeContents(box); s.addRange(rg); } };
  const regen = el('button', 'danger', 'Regenerate');
  regen.onclick = () => confirmModal({ title: 'Regenerate the token for ' + r.name + '?', sub: r.network_id,
    lead: 'A new token is issued and the current one stops working immediately. Whoever holds the old one is thrown off the network and keeps failing to re-join until it gets the new token.',
    details: ['Do this when a token may have leaked, or when a machine was replaced without your doing', 'Put the new token on the machine and restart it'],
    danger: 'Regenerate token',
    onConfirm: async () => { const n = await api(memberPath(r.network_id, r.name) + '/token', { method: 'POST' }); paintToken(openModal(n.name, n.network_id + ' · new token'), n, true); return true; } });
  bar.append(copy, regen); body.append(bar);

  body.append(el('h2', null, 'On the machine'));
  const snip = r.role === 'relay'
    ? `# /etc/nqvpn/relay.toml\nlisten = "0.0.0.0:4444"        # the port in this relay's address\n\n[[networks]]\ntoken = "${r.token}"\n\n# then:  nqvpn-relay --config /etc/nqvpn/relay.toml`
    : `# one-liner\nnqvpn-client --token "${r.token}"\n\n# or /etc/nqvpn/client.toml\ntoken = "${r.token}"`;
  body.append(el('pre', 'cfg', snip));
  body.append(el('p', 'note', `The token carries the coordinator endpoint (${r.coordinator}) and, for a self-signed coordinator, its certificate fingerprint — so the member verifies the coordinator with nothing else to configure (a CA-signed coordinator is verified against the system roots). Add trust_any_cert = true only to deliberately skip verification. If members reach the coordinator at a different address, set listen.public_url in coordinator.toml.`));
}

/* ---------- settings ---------- */
function settingsPane(st) {
  // The form is the operator's while this tab is open: fetched once, never
  // rebuilt by live frames (data-keep), reloaded after a save.
  const keep = 'settings:' + st.network_id;
  const pane = el('div'); pane.setAttribute('data-keep', keep);
  if (document.querySelector(`#view [data-keep="${CSS.escape(keep)}"]`)) return pane;
  const box = el('div'); box.append(el('div', 'empty', 'Loading…')); pane.append(box);
  const load = () => api(netPath(st.network_id) + '/config').then(cfg => {
    box.replaceChildren();
    const s = cfg.settings || {};
    const f = el('form', 'settings'); f.noValidate = false;
    const nav = el('nav', 'snav'); const panels = el('div');
    const sections = [];
    const section = (key, ic, title, lead, cls) => {
      const p = el('section', 'card spanel'); p.append(el('h3', null, title)); if (lead) p.append(el('p', 'note', lead));
      const g = el('div', 'grid2'); p.append(g); panels.append(p);
      const b = el('button', cls || ''); b.type = 'button'; b.append(icon(ic, 15), document.createTextNode(title));
      b.onclick = () => show(key); nav.append(b); sections.push({ key, p, b }); return g;
    };
    const REJOIN = 're-join';
    const num = (g, k, label, help, attrs = {}, tag) => { const i = inp(s[k], { type: 'number', ...attrs }); g.append(field(label, i, help, tag)); return i; };
    const pick = (g, label, help, options, current, tag) => {
      const sel = el('select'); for (const [v, l] of options) { const o = el('option', null, l); o.value = v; if (current === v) o.selected = true; sel.append(o); }
      g.append(field(label, sel, help, tag)); return sel;
    };

    const ga = section('addressing', 'hash', 'Addressing', 'The tunnel address space. Members are allocated addresses from these ranges, and each range is also the covering route into the tunnel.');
    const cidr4 = inp(cfg.ipv4_cidr || '', { required: '', placeholder: '10.99.0.0/16' });
    const cidr6 = inp(cfg.ipv6_cidr || '', { placeholder: 'fd99::/64' });
    ga.append(field('IPv4 CIDR', cidr4, 'Required.'), field('IPv6 CIDR', cidr6, 'Optional. Leave blank for an IPv4-only network.'));

    const gt = section('transport', 'swap', 'Transport', 'How sessions carry packets. Changes here make every member re-join to apply them.');
    const transport = pick(gt, 'Transport', 'stream works through anything; datagram has lower latency.', [['stream', 'stream'], ['datagram', 'datagram']], s.transport, REJOIN);
    const lanes = num(gt, 'lanes', 'Lanes', 'Parallel stream lanes per session (1–15).', { min: 1, max: 15 }, REJOIN);
    const mtu = num(gt, 'mtu', 'MTU', 'Tunnel MTU, 1280–9000.', { min: 1280, max: 9000 }, REJOIN);

    const gm = section('timing', 'clock', 'Timing', 'How quickly the network notices change, and how long credentials live.');
    const hb = num(gm, 'heartbeat_secs', 'Heartbeat (s)', 'Convergence after a lost push is bounded by this.', { min: 1 }, REJOIN);
    const off = num(gm, 'offline_after', 'Offline after (heartbeats)', 'Missed heartbeats before a member is shown offline.', { min: 1 });
    const ttl = num(gm, 'credential_ttl_mins', 'Credential lifetime (min)', 'Members renew at two thirds of this.', { min: 1 }, REJOIN);
    const hold = num(gm, 'hold_down_secs', 'Hold-down (s)', 'Damping when two relays front the same LAN. 0 = off.', { min: 0 });

    const gp = section('policy', 'shield', 'Limits & policy', 'Bandwidth defaults and which relays may join.');
    const capd = num(gp, 'max_session_mbps', 'Default per-client cap (Mbps)', '0 = none. Relays may override it per member.', { min: 0 }, REJOIN);
    const reach = pick(gp, 'Relay reachability check', 'After a relay joins, the coordinator dials its address: warn, refuse the join, or skip.', [['warn', 'warn'], ['deny', 'deny'], ['off', 'off']], s.relay_reachability);
    const loop = pick(gp, 'Allow loopback relay addresses', 'Only for single-machine demos.', [['false', 'no'], ['true', 'yes']], String(!!s.allow_loopback_relays));

    section('danger', 'alert', 'Danger zone', null, 'dz');
    const dzp = sections[sections.length - 1].p; dzp.querySelector('.grid2').remove();
    const dz = el('div', 'danger-zone'); dz.append(el('h3', null, 'Delete this network'));
    dz.append(el('p', null, 'Every member is thrown off and forgotten; tokens stop working. Export first if you may want it back.'));
    const del = el('button', 'danger'); del.type = 'button'; del.append(icon('trash', 15), document.createTextNode('Delete ' + st.network_id));
    del.onclick = () => { const now = frame.status[st.network_id] || st; confirmModal({ title: 'Delete network ' + st.network_id + '?', sub: `${now.members.length} members`,
      lead: 'This cannot be undone from the UI.', details: [`${now.members.filter(m => m.online).length} members are online right now`, 'All tokens for this network stop working'],
      danger: 'Delete network', onConfirm: async () => { await api(netPath(st.network_id), { method: 'DELETE' }); go('#/'); } }); };
    dz.append(del); dzp.append(dz);

    const savebar = el('div', 'savebar'); const state = el('span', 'state', 'All changes saved');
    const discard = el('button', 'ghost', 'Discard'); discard.type = 'button'; discard.hidden = true; discard.onclick = () => load();
    const save = el('button', 'primary', 'Save changes'); const err = el('span', 'msg err');
    savebar.append(state, err, el('span', 'spacer'), discard, save); panels.append(savebar);
    const dirty = on => { savebar.classList.toggle('dirty', on); state.textContent = on ? 'Unsaved changes' : 'All changes saved'; discard.hidden = !on; };
    f.oninput = f.onchange = () => dirty(true);

    const show = key => {
      settingsSection = key;
      for (const x of sections) { x.p.hidden = x.key !== key; x.b.classList.toggle('active', x.key === key); }
      savebar.hidden = key === 'danger';
    };
    // An invalid field may be in a section that is not showing. One check
    // fires `invalid` for every bad field in order; show the first one's.
    let revealed = false;
    f.addEventListener('invalid', e => {
      if (revealed) return; revealed = true; setTimeout(() => { revealed = false; }, 0);
      const x = sections.find(x => x.p.contains(e.target)); if (x) show(x.key);
    }, true);
    f.append(nav, panels);
    show(sections.some(x => x.key === settingsSection) ? settingsSection : 'addressing');

    f.onsubmit = async e => {
      e.preventDefault(); save.disabled = true; err.textContent = '';
      const spec = { network_id: st.network_id, ipv4_cidr: cidr4.value.trim(), ipv6_cidr: optStr(cidr6.value.trim()), settings: {
        credential_ttl_mins: Number(ttl.value), heartbeat_secs: Number(hb.value), offline_after: Number(off.value), hold_down_secs: Number(hold.value),
        mtu: Number(mtu.value), lanes: Number(lanes.value), max_session_mbps: Number(capd.value), transport: transport.value,
        relay_reachability: reach.value, allow_loopback_relays: loop.value === 'true' } };
      try { await api(netPath(st.network_id), { method: 'PUT', body: spec }); msg('Settings saved'); load(); } catch (ex) { err.textContent = ex.message; }
      save.disabled = false;
    };
    box.append(f);
  }).catch(e => box.replaceChildren(el('div', 'empty', e.message)));
  load();
  return pane;
}

/* ---------- stats: the N x N traffic matrix ---------- */
function relaysOf(st) { return st.members.filter(m => m.role === 'relay' && m.node_id).sort((a, b) => a.node_id - b.node_id); }
function trafficIndex(st) {
  const rows = new Map(), links = new Map();
  for (const r of (st.relay_traffic || [])) { rows.set(r.relay, r); for (const l of r.links) links.set(r.relay + ' ' + l.peer, l); }
  return { rows, links };
}
function matrixPane(st) {
  const pane = el('div');
  const relays = relaysOf(st);
  pane.append(heading(st, 'Fleet traffic'));
  if (!relays.length) { pane.append(el('div', 'empty', 'No relays in this network.')); return pane; }
  const idx = trafficIndex(st);
  if (!idx.rows.size) { pane.append(el('div', 'empty', 'No relay has reported traffic yet. Reports arrive with every heartbeat from relays with a live control session.')); return pane; }
  pane.append(el('p', 'note', 'Row is the sending relay, column the receiving one. Each cell is what the row relay measured on that link: ↑ bytes it sent, ↓ bytes it received. Every link therefore appears twice — a gap between one relay’s ↑ and its peer’s ↓ is loss on that link. The diagonal is traffic switched between two members attached to the same relay. Counters are cumulative since each relay started.'));
  let peak = 0;
  for (const l of idx.links.values()) peak = Math.max(peak, l.tx_bytes, l.rx_bytes);
  for (const r of idx.rows.values()) peak = Math.max(peak, r.local_bytes);
  const heat = v => { if (!v || !peak) return 0; const t = Math.log(v + 1) / Math.log(peak + 1); return .03 + .35 * t * t * t; };
  const t = el('table', 'matrix');
  const thead = el('thead'), htr = el('tr'); htr.append(el('th', 'corner', 'src \\ dst'));
  relays.forEach(r => { const th = el('th'); th.append(el('div', null, r.name)); th.append(el('div', 'tiny muted', '#' + r.node_id)); htr.append(th); });
  thead.append(htr); t.append(thead);
  const tb = el('tbody');
  for (const src of relays) {
    const tr = el('tr'); const th = el('th'); th.append(el('div', null, src.name));
    const row = idx.rows.get(src.name); th.append(el('div', 'tiny muted', row ? `${row.age_secs}s ago` : 'no report')); tr.append(th);
    for (const dst of relays) {
      const td = el('td');
      if (src.node_id === dst.node_id) {
        td.className = 'diag'; const v = row ? row.local_bytes : 0;
        if (v) { td.append(shade(heat(v))); const c = el('div', 'cell'); c.append(el('div', 'up', fmtBytes(v))); c.append(el('div', 'dn', fmtPkts(row.local_pkts) + ' pkts')); td.append(c);
          td.title = `${src.name} switched ${fmtBytes(v)} between members attached to it`; }
        else td.append(el('span', 'zero', '·'));
        tr.append(td); continue;
      }
      const link = idx.links.get(src.name + ' ' + dst.name);
      if (!link || (!link.tx_bytes && !link.rx_bytes)) { td.append(el('span', 'zero', link ? '0' : '—')); td.title = link ? 'Link exists, nothing sent yet' : 'No mesh link reported between these relays'; if (link && !link.up) td.className = 'down'; tr.append(td); continue; }
      td.append(shade(heat(Math.max(link.tx_bytes, link.rx_bytes)))); if (!link.up) td.className = 'down';
      const c = el('div', 'cell'); c.append(el('div', 'up', '↑ ' + fmtBytes(link.tx_bytes))); c.append(el('div', 'dn', '↓ ' + fmtBytes(link.rx_bytes)));
      const rate = [link.tx_bps && '↑' + fmtRate(link.tx_bps), link.rx_bps && '↓' + fmtRate(link.rx_bps)].filter(Boolean).join('  ');
      if (rate) c.append(el('div', 'rate', rate)); td.append(c);
      td.title = `${src.name} → ${dst.name} (#${link.peer_node_id})\nsent ${fmtBytes(link.tx_bytes)} (${fmtPkts(link.tx_pkts)} pkts)\nreceived ${fmtBytes(link.rx_bytes)} (${fmtPkts(link.rx_pkts)} pkts)\n` + (link.up ? 'link up' : 'link DOWN — these are historical totals');
      tr.append(td);
    }
    tb.append(tr);
  }
  t.append(tb); const wrap = el('div', 'wrap'); wrap.append(t); pane.append(wrap);
  const legend = el('div', 'legend');
  const sw = (bg, label) => { const s = el('span'); const b = el('i', 'sw'); b.style.background = bg; s.append(b, document.createTextNode(label)); return s; };
  legend.append(sw('rgba(var(--heat),.28)', 'busier link')); legend.append(sw('var(--sunk)', 'diagonal — switched locally, no link crossed'));
  const dead = el('span'); const db = el('i', 'sw'); db.style.cssText = 'border:1px dashed var(--warn);background:transparent'; dead.append(db, document.createTextNode('link currently down')); legend.append(dead);
  pane.append(legend);
  pane.append(el('h2', null, 'Relay totals'));
  pane.append(table(['Relay','Mesh sent','Mesh received','Rate now','Switched locally','Terminated here','Links'], relays.map(r => {
    const row = idx.rows.get(r.name); const tr = el('tr'); tr.append(el('td', null, r.name));
    if (!row) { const td = el('td', 'muted'); td.colSpan = 6; td.textContent = 'no report yet'; tr.append(td); return tr; }
    const tx = row.links.reduce((a, l) => a + l.tx_bytes, 0), rx = row.links.reduce((a, l) => a + l.rx_bytes, 0);
    const txr = row.links.reduce((a, l) => a + l.tx_bps, 0), rxr = row.links.reduce((a, l) => a + l.rx_bps, 0);
    tr.append(el('td', null, fmtBytes(tx)), el('td', null, fmtBytes(rx)), el('td', 'muted', [fmtRate(txr), fmtRate(rxr)].filter(Boolean).join(' / ') || '—'),
      el('td', null, fmtBytes(row.local_bytes)), el('td', null, fmtBytes(row.terminated_bytes)), el('td', 'muted tiny', row.links.filter(l => l.up).length + ' up'));
    return tr;
  })));
  return pane;
}
function shade(alpha) { const d = el('div', 'heat'); d.style.opacity = alpha; return d; }

/* ---------- topology ---------- */
function topologyPane(st) {
  const pane = el('div');
  pane.append(heading(st, 'Topology'));
  const relays = relaysOf(st);
  if (!relays.length) { pane.append(el('div', 'empty', 'No relay has joined this network yet.')); return pane; }
  pane.append(el('p', 'note', 'Relays form a full mesh; every client attaches to exactly one of them and reaches everyone else through it. Line weight follows how much traffic a link has carried. Click any node for its details. Updates live.'));
  const idx = trafficIndex(st);
  const byRelay = new Map(relays.map(r => [r.name, []])); const unattached = [];
  for (const m of st.members) { if (m.role === 'relay') continue;
    if (m.attached_relay && byRelay.has(m.attached_relay)) byRelay.get(m.attached_relay).push(m); else if (m.online) unattached.push(m); }
  const W = 940, H = 700, cx = W/2, cy = H/2 - 10;
  const R = relays.length === 1 ? 0 : Math.min(185, 92 + relays.length * 24);
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' });
  const pos = new Map();
  relays.forEach((r, i) => { const a = -Math.PI/2 + (i * 2 * Math.PI) / relays.length; pos.set(r.name, { x: cx + R * Math.cos(a), y: cy + R * Math.sin(a), a }); });
  let peak = 0; for (const l of idx.links.values()) peak = Math.max(peak, l.tx_bytes + l.rx_bytes);
  const drawn = new Set();
  for (const a of relays) for (const b of relays) {
    if (a.node_id >= b.node_id) continue; const key = a.name + ' ' + b.name; if (drawn.has(key)) continue; drawn.add(key);
    const ab = idx.links.get(a.name + ' ' + b.name), ba = idx.links.get(b.name + ' ' + a.name); if (!ab && !ba) continue;
    const vol = (ab ? ab.tx_bytes + ab.rx_bytes : 0) + (ba ? ba.tx_bytes + ba.rx_bytes : 0); const up = (ab && ab.up) || (ba && ba.up);
    const p1 = pos.get(a.name), p2 = pos.get(b.name); const w = peak ? 1.2 + 6 * (Math.log(vol + 1) / Math.log(peak * 2 + 1)) : 1.2;
    const line = svgEl('line', { x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, class: 'link' + (up ? '' : ' dead'), 'stroke-width': w.toFixed(2), 'stroke-opacity': up ? 0.42 : 0.3 });
    const t = svgEl('title'); t.textContent = `${a.name} ↔ ${b.name}\n${fmtBytes(vol)} total\n${up ? 'up' : 'DOWN'}`; line.append(t); svg.append(line);
  }
  relays.forEach(r => {
    const p = pos.get(r.name); const kids = byRelay.get(r.name) || []; const online = kids.filter(k => k.online);
    const outward = relays.length === 1 ? -Math.PI/2 : p.a;
    online.forEach((c, i) => {
      const spread = Math.min(2.6, 0.5 * (online.length - 1));
      const a = outward - spread/2 + (online.length === 1 ? 0 : spread * i / (online.length - 1));
      const rad = 84 + (i % 2) * 28; const cxx = p.x + rad * Math.cos(a), cyy = p.y + rad * Math.sin(a);
      svg.append(svgEl('line', { x1: p.x, y1: p.y, x2: cxx, y2: cyy, stroke: 'currentColor', 'stroke-opacity': .22, 'stroke-width': 1 }));
      const g = svgEl('g', { class: 'node', 'data-key': 'c:' + c.name });
      g.append(svgEl('circle', { cx: cxx, cy: cyy, r: 9, fill: 'var(--accent2)', 'fill-opacity': .85 }));
      const lbl = svgEl('text', { x: cxx, y: cyy + 22, class: 'clabel' }); lbl.textContent = c.name.length > 14 ? c.name.slice(0, 13) + '…' : c.name; g.append(lbl);
      const t = svgEl('title'); t.textContent = `${c.name} (#${c.node_id})\n${addrOf(c) || 'no address'}`; g.append(t);
      g.onclick = () => showMember(st, c); svg.append(g);
    });
  });
  relays.forEach(r => {
    const p = pos.get(r.name); const kids = (byRelay.get(r.name) || []).filter(k => k.online).length;
    const g = svgEl('g', { class: 'node', 'data-key': 'r:' + r.name });
    g.append(svgEl('circle', { cx: p.x, cy: p.y, r: 30, fill: r.online ? 'var(--accent)' : 'var(--off)', 'fill-opacity': r.online ? .16 : .1 }));
    g.append(svgEl('circle', { class: 'ring', cx: p.x, cy: p.y, r: 30, fill: 'none', stroke: r.online ? 'var(--accent)' : 'var(--off)', 'stroke-width': 2, 'stroke-dasharray': r.online ? '' : '4 4' }));
    const count = svgEl('text', { x: p.x, y: p.y + 5, class: 'nlabel' }); count.textContent = kids; g.append(count);
    const name = svgEl('text', { x: p.x, y: p.y + 48, class: 'nlabel' }); name.textContent = r.name; g.append(name);
    const sub = svgEl('text', { x: p.x, y: p.y + 63, class: 'nsub' }); sub.textContent = r.ip4 || ('#' + r.node_id); g.append(sub);
    const t = svgEl('title'); t.textContent = `${r.name} (#${r.node_id})\n${kids} client(s) attached\n${r.online ? 'online' : 'offline'}`; g.append(t);
    g.onclick = () => showRelay(st, r); svg.append(g);
  });
  const map = el('div', 'map'); map.append(svg); pane.append(map);
  const clients = st.members.filter(m => m.role !== 'relay');
  if (clients.length) {
    pane.append(el('h2', null, 'Attachments'));
    pane.append(table(['Member','State','Attached relay','Address','Heartbeat'], clients.map(m => {
      const tr = el('tr'); tr.append(el('td', null, m.name)); const s = el('td'); s.append(pill(m)); tr.append(s);
      tr.append(el('td', m.attached_relay ? '' : 'muted', m.attached_relay || '—'));
      const ip = el('td'); ip.append(el('code', null, addrOf(m) || '—')); tr.append(ip);
      tr.append(el('td', 'muted tiny', m.last_heartbeat_unix ? fmtAge(m.last_heartbeat_unix) + ' ago' : '—')); return tr;
    })));
  }
  if (unattached.length) {
    pane.append(el('h2', null, 'Online but attached to no relay'));
    pane.append(table(['Member','Address'], unattached.map(m => { const tr = el('tr'); tr.append(el('td', null, m.name)); const ip = el('td'); ip.append(el('code', null, addrOf(m) || '—')); tr.append(ip); return tr; })));
  }
  return pane;
}

/* ---------- modal ---------- */
function openModal(title, sub) { $('#modal-title').textContent = title; $('#modal-sub').textContent = sub || '';
  const body = $('#modal-body'); body.replaceChildren(); $('#overlay').hidden = false; return body; }
function closeModal() { $('#overlay').hidden = true; }
$('#modal-close').onclick = closeModal;
$('#overlay').onclick = e => { if (e.target === $('#overlay')) closeModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function confirmModal({ title, sub, lead, details, danger, onConfirm }) {
  const body = openModal(title, sub); body.append(el('p', 'note', lead));
  if (details && details.length) { const ul = el('ul', 'clist'); details.forEach(d => { const li = el('li'); li.append(el('span', null, d)); ul.append(li); }); body.append(ul); }
  const bar = el('div', 'bar'); bar.style.marginTop = '18px';
  const go = el('button', 'danger', danger || 'Confirm'); go.style.fontWeight = '600'; const cancel = el('button', null, 'Cancel');
  go.onclick = async () => { go.disabled = true; cancel.disabled = true; try { const keep = await onConfirm(); if (!keep) closeModal(); } catch (e) { msg(e.message, true); closeModal(); } };
  cancel.onclick = closeModal; bar.append(go, cancel); body.append(bar);
}
function kv(pairs) { const d = el('dl', 'kv'); for (const [k, v] of pairs) { if (v === undefined || v === null || v === '') continue; d.append(el('dt', null, k), el('dd', null, v)); } return d; }
function commonRows(st, m) {
  const v = viewState(st, m);
  return [ ['Node id', m.node_id ? '#' + m.node_id : 'not joined yet'], ['Address', addrOf(m) || '—'], ['Routed CIDRs', (m.registered_cidrs || []).join(' ') || '—'],
    ['Disabled', m.disabled ? 'yes' : 'no'], ['Config Version', v.label + (m.reported_gen === undefined ? '' : ` (network's is from ${genTime(st.gen)}, digest ${m.digest_ok ? 'ok' : 'MISMATCH'})`)],
    ['Heartbeat', m.last_heartbeat_unix ? fmtAge(m.last_heartbeat_unix) + ' ago · ' + fmtTime(m.last_heartbeat_unix) : '—'],
    ['Last join', m.last_join_unix ? fmtTime(m.last_join_unix) + ' from ' + (m.last_join_from || 'unknown') : 'never'], ['Login gen', m.login_gen],
    ['Replaced', replacedNote(m) || undefined] ];
}
function showRelay(st, r) {
  const body = openModal(r.name, `relay · ${r.online ? 'online' : 'offline'}`);
  const idx = trafficIndex(st); const row = idx.rows.get(r.name);
  const kids = st.members.filter(m => m.role !== 'relay' && m.attached_relay === r.name); const online = kids.filter(k => k.online);
  body.append(kv([ ...commonRows(st, r), ['Dialable', r.advertised_reachable || 'unknown'],
    ['Mesh sent', row ? fmtBytes(row.links.reduce((a, l) => a + l.tx_bytes, 0)) : '—'], ['Mesh received', row ? fmtBytes(row.links.reduce((a, l) => a + l.rx_bytes, 0)) : '—'],
    ['Switched locally', row ? fmtBytes(row.local_bytes) : '—'], ['Terminated here', row ? fmtBytes(row.terminated_bytes) : '—'] ]));
  const bar = el('div', 'bar'); const t = el('button', null, 'Token'); t.onclick = () => showToken(st.network_id, r.name, false);
  const e = el('button', null, 'Edit'); e.onclick = () => memberForm(st, r); bar.append(t, e); body.append(bar);
  body.append(el('h2', null, `Attached clients (${online.length})`));
  if (!online.length) body.append(el('div', 'empty', 'No clients are attached to this relay right now.'));
  else { const ul = el('ul', 'clist'); for (const c of online.sort((a, b) => a.name.localeCompare(b.name))) { const li = el('li'); li.append(el('span', 'nm', c.name), el('code', 'tiny muted', '#' + c.node_id), el('span', 'ips', addrOf(c) || 'no address')); ul.append(li); } body.append(ul); }
  const offline = kids.filter(k => !k.online);
  if (offline.length) { body.append(el('h2', null, `Last seen here, now offline (${offline.length})`)); const ul = el('ul', 'clist'); for (const c of offline) { const li = el('li'); li.append(el('span', 'nm muted', c.name), el('span', 'ips', addrOf(c) || '—')); ul.append(li); } body.append(ul); }
  if (row && row.links.length) {
    body.append(el('h2', null, 'Mesh links'));
    body.append(table(['Peer','Sent','Received','Rate now','State'], row.links.map(l => { const tr = el('tr');
      const p = el('td'); p.append(document.createTextNode(l.peer + ' '), el('code', 'tiny muted', '#' + l.peer_node_id)); tr.append(p);
      tr.append(el('td', null, fmtBytes(l.tx_bytes)), el('td', null, fmtBytes(l.rx_bytes)), el('td', 'muted', [fmtRate(l.tx_bps), fmtRate(l.rx_bps)].filter(Boolean).join(' / ') || '—'));
      const s = el('td'); s.append(el('span', 'pill ' + (l.up ? 'on' : 'offl'), l.up ? 'up' : 'down')); tr.append(s); return tr; })));
  }
}
function showMember(st, m) {
  const body = openModal(m.name, `${m.role} · ${m.online ? 'online' : 'offline'}`);
  body.append(kv([ ...commonRows(st, m), ['Attached relay', m.attached_relay || '—'] ]));
  const bar = el('div', 'bar');
  if (m.attached_relay) { const relay = st.members.find(r => r.name === m.attached_relay); if (relay) { const b = el('button', null, `Open ${relay.name}`); b.onclick = () => showRelay(st, relay); bar.append(b); } }
  const t = el('button', null, 'Token'); t.onclick = () => showToken(st.network_id, m.name, false);
  const e = el('button', null, 'Edit'); e.onclick = () => memberForm(st, m); bar.append(t, e); body.append(bar);
}

/* ---------- boot ---------- */
setInterval(() => { $('#clock').textContent = new Date().toLocaleTimeString(); }, 1000);
(async () => {
  try { const me = await (await fetch('/api/v1/me', { credentials: 'same-origin' })).json(); if (me.user) { showApp(me.user); return; } } catch {}
  showLogin();
})();
