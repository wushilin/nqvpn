[package]
name = "nqvpn-endpoint"
version.workspace = true
edition.workspace = true
license.workspace = true

# Everything that terminates traffic: the Noise engine, the peer table
# and ingress filter, the TUN device, OS route programming, and the
# one-endpoint-per-host guard. Shared by the client and by a relay in
# its gateway role. Depends on nothing but the protocol crate.

[dependencies]
nqvpn-proto.workspace = true
anyhow.workspace = true
ipnet.workspace = true
libc.workspace = true
tokio.workspace = true
tracing.workspace = true
getifaddrs.workspace = true

# The OS backends — the TUN device (tun_real) and route programming
# (NetRouteProgrammer) — exist on Linux and macOS only, so their crates
# are only built there. Elsewhere they are not merely unused: route_manager,
# which tun-rs also pulls in on every BSD, does not compile for FreeBSD
# arm64.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
tun-rs.workspace = true
route_manager.workspace = true

[dev-dependencies]
tempfile.workspace = true
