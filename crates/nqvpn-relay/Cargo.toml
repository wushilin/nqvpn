[package]
name = "nqvpn-relay"
version.workspace = true
edition.workspace = true
license.workspace = true

# Forwarding only. A relay holds one `RelayNet` per network it serves:
# the two forwarding tables, the sessions that feed them, the mesh
# dialers, and — optionally — an endpoint role for its own address and
# the LAN it fronts.

