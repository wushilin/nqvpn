[package]
name = "nqvpn-session"
version.workspace = true
edition.workspace = true
license.workspace = true

# One task owns one QUIC connection: authentication at Hello, the
# control stream (Refresh, probes), credential expiry, and data-plane
# liveness. Used on every hop — client↔relay and relay↔relay — from both
# ends. Knows nothing about tables, routes, or the coordinator.

[dependencies]
nqvpn-proto.workspace = true
anyhow.workspace = true
bytes.workspace = true
quinn.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
rand.workspace = true
base64.workspace = true
serde_json.workspace = true
